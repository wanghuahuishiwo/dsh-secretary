<script>
const $=s=>document.querySelector(s); const icon=(id)=>`<svg><use href="#i-${id}"/></svg>`;
const params=new URLSearchParams(location.search); let variant=params.get('variant')==='rail'?'rail':'mac';
let perspective='projects', selected='a1', showInspector=true, quick=false, query='';
const perspectives=[['inbox','收件箱','inbox',3],['projects','项目','projects',0],['next','下一步','next',0],['tags','标签','tag',0],['forecast','预测','calendar',2],['flagged','已标记','flag',2],['review','检查','review',3]];

 {id:'p1',name:'dsh-secretary 产品拆分',folder:'工作',outcome:'两个产品各自有清楚的入口与交互。'},

 {id:'a2',project:'p1',title:'画出两个产品的独立入口',note:'小秘书-时间块与小秘书-事项。',tags:['电脑'],planned:'今天 20:30'},
 {id:'a3',project:'p2',title:'跑一遍完整冷启动验收',tags:['电脑'],due:'明天'},
 {id:'a4',project:'p2',title:'整理本轮验证证据',tags:['电脑'],planned:'明天 10:00'},
 {id:'a5',project:'p3',title:'预订住宿',note:'确认取消规则后再付款。',tags:['手机'],due:'11月8日'},
 {id:'a6',project:'p3',title:'列出三日路线',tags:['在家'],defer:'明天'},
 {id:'a7',project:'p4',title:'读完第五章',tags:['在家'],due:'昨天',status:'overdue'},
 {id:'a8',project:'p4',title:'写下三个讨论问题',tags:['在家'],planned:'11月7日 19:00'}

function dateOf(a){const text=`${a.due||''} ${a.planned||''} ${a.defer||''}`;if(text.includes('今天'))return '2026-11-04';if(text.includes('明天'))return '2026-11-05';if(text.includes('昨天'))return '2026-11-03';if(text.includes('11月8日'))return '2026-11-08';if(text.includes('11月7日'))return '2026-11-07';return ''}
function forecastLabel(a){const d=dateOf(a);return d<'2026-11-04'?'过去':d==='2026-11-04'?'今天 · 11月4日':d==='2026-11-05'?'明天 · 11月5日':d==='2026-11-07'?'11月7日 · 周六':d==='2026-11-08'?'11月8日 · 周日':'未来'}
function visibleActions(){let list=actions.filter(matches);if(perspective==='flagged')list=list.filter(a=>a.flag);if(perspective==='next')list=list.filter(a=>!a.defer&&a.status!=='overdue');if(perspective==='forecast'){if(treeSelected.startsWith('2026-'))list=list.filter(a=>dateOf(a)===treeSelected);if(treeSelected==='past')list=list.filter(a=>dateOf(a)<'2026-11-04');if(treeSelected==='future')list=list.filter(a=>dateOf(a)>'2026-11-04');list=list.slice().sort((a,b)=>dateOf(a).localeCompare(dateOf(b)))}if(treeSelected!=='all'&&['projects','review'].includes(perspective))list=list.filter(a=>a.project===treeSelected||project(a.project)?.folder===treeSelected);if(treeSelected!=='all'&&perspective==='tags')list=list.filter(a=>a.tags.includes(treeSelected));return list}
function row(a){return `<div class="row ${selected===a.id?'on':''} ${a.done?'done':''}" data-action="${a.id}"><button class="status ${a.status||''} ${a.flag?'flag':''}" aria-label="完成 ${a.title}" data-complete="${a.id}"></button><div><div class="name">${a.title}</div><div class="meta">${a.tags.map(t=>`<span class="chip">${t}</span>`).join('')}${a.defer?`<span>推迟 · ${a.defer}</span>`:''}${a.planned?`<span>计划 · ${a.planned}</span>`:''}${a.due?`<span class="chip ${a.status==='overdue'?'overdue':'due'}">${a.due}</span>`:''}${['tags','forecast','next'].includes(perspective)?`<span class="chip project">${project(a.project)?.name||''}</span>`:''}</div>${a.note?`<div class="note">${a.note}</div>`:''}</div><div class="row-icons">${a.note?icon('note'):''}${a.flag?`<span class="flag">${icon('flag')}</span>`:''}</div></div>`}
function grouped(list){const groups=[];for(const a of list){const key=['projects','review'].includes(perspective)?project(a.project)?.name:perspective==='forecast'?forecastLabel(a):perspective==='tags'?a.tags[0]:'当前可做';let g=groups.find(x=>x.key===key);if(!g){g={key,items:[]};groups.push(g)}g.items.push(a)}return groups}
function renderPerspectives(){$('#perspectives').innerHTML=perspectives.map(([id,name,ic,count])=>`<button class="perspective ${perspective===id?'on':''}" data-p="${id}">${icon(ic)}<span>${name}</span>${count?`<span class="badge">${id==='inbox'?inbox.length:count}</span>`:''}</button>`).join('')}
function renderCalendar(){const count=d=>actions.filter(a=>dateOf(a)===d).length;const days=Array.from({length:30},(_,i)=>{const day=i+1,d=`2026-11-${String(day).padStart(2,'0')}`,n=count(d);return `<button class="cal-day ${day===4?'today':''} ${treeSelected===d?'on':''}" data-node="${d}">${day}${n?`<span class="dots">${n}</span>`:''}</button>`}).join('');return `<div class="calendar"><div class="cal-title">2026年11月</div><div class="cal-grid">${['日','一','二','三','四','五','六'].map(d=>`<span class="weekday">${d}</span>`).join('')}${days}${'<span></span>'.repeat(5)}</div></div><button class="cal-range" data-node="past">过去 · ${actions.filter(a=>dateOf(a)<'2026-11-04').length}</button><button class="cal-range" data-node="future">未来 · ${actions.filter(a=>dateOf(a)>'2026-11-04').length}</button>`}
function renderTree(){const available=sidebarViews.includes(perspective);$('#tree').classList.toggle('unavailable',!available);$('#treeToggle').disabled=!available;if(!available){$('#tree').classList.remove('open');$('#tree').innerHTML='';return}if(perspective==='forecast'){$('#tree').innerHTML=renderCalendar();return}const nodes=treeNodes[perspective]||[];$('#tree').innerHTML=`<div class="tree-title">${perspectives.find(p=>p[0]===perspective)[1]}</div>`+nodes.map(n=>`<button class="tnode ${n.child?'child':''} ${treeSelected===n.id?'on':''}" data-node="${n.id}">${icon(n.icon)}<span>${n.name}</span></button>`).join('')}
function piano(){const tiles=[['past','过去'],['2026-11-04','今天'],['2026-11-05','明天'],['2026-11-07','周六'],['2026-11-08','周日'],['future','未来']];return `<div class="piano">${tiles.map(([id,name])=>{const list=id==='past'?actions.filter(a=>dateOf(a)<'2026-11-04'):id==='future'?actions.filter(a=>dateOf(a)>'2026-11-04'):actions.filter(a=>dateOf(a)===id);return `<button class="${id==='2026-11-04'?'today':''} ${treeSelected===id?'on':''}" data-node="${id}">${name}<b>${list.length}</b></button>`}).join('')}</div>`}
function renderOutline(){const title=perspectives.find(p=>p[0]===perspective)[1];$('#viewTitle').textContent=title;$('#viewTitle').style.setProperty('--accent',`var(--${perspective==='tags'?'purple':perspective==='forecast'?'red':perspective==='flagged'?'orange':perspective==='review'?'review':'blue'})`);$('#viewActions').innerHTML=perspective==='review'?'<button class="tbtn" data-review="-1" title="上一项目">⌃</button><button class="tbtn" data-review="1" title="下一项目">⌄</button><button class="primary" id="reviewed">标记已检查</button>':'';const list=visibleActions();const reviewIndex=projects.findIndex(p=>p.id===treeSelected);$('#viewSub').textContent=perspective==='inbox'?`${inbox.length} 条待澄清`:perspective==='review'?`项目 ${reviewIndex+1} / ${projects.length} · 每周检查 · 上次检查 10月28日`:perspective==='forecast'?'按日期查看截止与计划事项':`${list.length} 条行动 · ${projects.length} 个项目`;if(perspective==='inbox'){$('#outline').innerHTML=`<div class="group">${inbox.map(i=>`<div class="row"><span class="status"></span><div><div class="name">${i.title}</div>${i.note?`<div class="note">${i.note}</div>`:''}</div><div class="row-icons"><button class="secondary-btn" data-clarify="${i.id}">澄清</button></div></div>`).join('')}</div>`;return}const groups=grouped(list);$('#outline').innerHTML=(perspective==='forecast'?piano():'')+(groups.map(g=>`<section class="group"><div class="group-title"><span class="chev">⌄</span>${g.key}</div>${g.items.map(row).join('')}</section>`).join('')||'<div style="padding:30px;color:var(--secondary)">当前视图没有匹配事项。</div>')}
function renderInspector(){const el=$('#inspector');el.classList.toggle('hidden',!showInspector);$('#inspectorToggle').classList.toggle('on',showInspector);const a=action(selected);if(!a){el.innerHTML='<div style="color:var(--secondary)">选择一条行动查看详情。</div>';return}el.innerHTML=`<div class="inspect-note">${a.note||'没有备注'}</div><section class="isection"><h3>状态</h3><div class="ifield"><span>当前状态</span><strong>${a.done?'已完成':a.status==='overdue'?'已逾期':'进行中'}</strong></div><div class="ifield"><span>旗标</span><strong>${a.flag?'已标记':'未标记'}</strong></div></section><section class="isection"><h3>项目</h3><select class="iselect" style="width:100%"><option>${project(a.project)?.name||'独立行动'}</option></select></section><section class="isection"><h3>情境标签</h3><div class="tagpick">${a.tags.map(t=>`<span>${t}</span>`).join('')}</div></section><section class="isection"><h3>日期与时间</h3><div class="ifield"><span>推迟</span><strong>${a.defer||'无'}</strong></div><div class="ifield"><span>计划</span><strong>${a.planned||'无'}</strong></div><div class="ifield"><span>截止</span><strong>${a.due||'无'}</strong></div></section>`}
function renderAll(){ $('#window').classList.toggle('rail',variant==='rail');$('#vMac').classList.toggle('on',variant==='mac');$('#vRail').classList.toggle('on',variant==='rail');renderPerspectives();renderTree();renderOutline();renderInspector(); }
function say(text){$('#toast').innerHTML=`<div class="toast">${text}</div>`;setTimeout(()=>$('#toast').innerHTML='',1500)}
function renderQuick(){if(!quick){$('#modal').innerHTML='';return}$('#modal').innerHTML=`<div class="scrim" id="quickScrim"><form class="quick" id="quickForm"><div class="quick-action-row"><span class="status"></span><div><input id="quickTitle" autofocus placeholder="新事项" aria-label="捕获标题"><div class="quick-fields"><button type="button">项目</button><button type="button">情境标签</button><button type="button">截止</button><button type="button">重复</button></div><input class="quick-note" id="quickNote" placeholder="添加备注" aria-label="捕获备注"></div><div class="row-icons">${icon('note')}${icon('flag')}</div></div><div class="quick-actions"><button type="button" class="tbtn" title="View Options">${icon('eye')}</button><span class="grow"></span><button type="button" class="secondary-btn" id="quickCancel">取消</button><button class="primary" type="submit">保存</button></div></form></div>`}
function reviewStep(direction){const index=projects.findIndex(p=>p.id===treeSelected);treeSelected=projects[(index+direction+projects.length)%projects.length].id;selected=visibleActions()[0]?.id||null;renderAll()}
document.addEventListener('click',e=>{const p=e.target.closest('[data-p]');if(p){perspective=p.dataset.p;treeSelected=perspective==='review'?'p1':'all';selected=perspective==='inbox'?null:(visibleActions()[0]?.id||null);renderAll();return}const n=e.target.closest('[data-node]');if(n){treeSelected=n.dataset.node;$('#tree').classList.remove('open');selected=visibleActions()[0]?.id||null;renderTree();renderOutline();renderInspector();return}const c=e.target.closest('[data-complete]');if(c){e.stopPropagation();const a=action(c.dataset.complete);a.done=!a.done;renderOutline();renderInspector();say(a.done?'已完成':'已恢复');return}const r=e.target.closest('[data-action]');if(r){selected=r.dataset.action;showInspector=true;renderOutline();renderInspector();return}if(e.target.closest('.open-quick')){quick=true;renderQuick();return}if(e.target.closest('#quickCancel')||e.target.id==='quickScrim'){quick=false;renderQuick();return}if(e.target.closest('#inspectorToggle')){showInspector=!showInspector;renderInspector();return}if(e.target.closest('#treeToggle')){if(variant==='rail')$('#tree').classList.toggle('open');else $('#tree').style.display=$('#tree').style.display==='none'?'':'none';return}if(e.target.closest('[data-review]')){reviewStep(Number(e.target.closest('[data-review]').dataset.review));return}if(e.target.closest('#reviewed')){say('已记录本次项目检查（原型）');reviewStep(1);return}if(e.target.closest('#focusBtn')){say('Focus 只改变当前大纲范围（原型）');return}if(e.target.closest('#viewOptions')){say('View Options 决定行字段与密度（原型）');return}if(e.target.closest('[data-clarify]')){say('澄清交互在原型中仅作位置确认');return}if(e.target.closest('#themeToggle')){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'}});
document.addEventListener('submit',e=>{if(e.target.id!=='quickForm')return;e.preventDefault();const title=$('#quickTitle').value.trim();if(!title)return;inbox.push({id:`i${inbox.length+1}`,title,note:$('#quickNote').value});quick=false;renderQuick();renderPerspectives();renderOutline();say('已保存到收件箱（仅内存）')});
$('#search').addEventListener('input',e=>{query=e.target.value;renderOutline()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&quick){quick=false;renderQuick()}if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){variant=variant==='mac'?'rail':'mac';history.replaceState(null,'',`?variant=${variant}`);renderAll()}});
renderAll();
</script>
</body>
</html>
