<!doctype html>
<html lang="zh-CN" data-theme="light" data-variant="A" data-mode="actual" data-energy="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>小秘书 · 时间块</title>
  <style>
    /* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio, geometry.
       Put this @layer first; product CSS outside the layer wins ordinary layout rules.
       Native hidden and closed-dialog states take precedence over component display rules. */
    @layer od-layout {
      [hidden]:not([hidden="until-found" i]) { display: none !important; }
      dialog:not([open]) { display: none !important; }

      :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

      .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
      .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
      .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
      .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
      .od-fill    { flex: 1 1 0; min-width: 0; }
      .od-fixed   { flex: none; }
      .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

      .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
      :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
      .od-tile { display: grid; grid-template-rows: auto 1fr; }
      :where(.od-tile) > :where(*) { display: block; }

      .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
      .od-media-cover { object-fit: cover; }

      .od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }

      .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
      .od-clamp-2 { -webkit-line-clamp: 2; }
      .od-clamp-3 { -webkit-line-clamp: 3; }
      .od-lines-2 { min-height: calc(2 * 1.4em); }
      .od-nowrap  { white-space: nowrap; }
      .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

      .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
      .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

      .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
                 padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
      .od-rail::-webkit-scrollbar { display: none; }
      :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
      :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

      .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
      .od-touch  { min-width: 44px; min-height: 44px; }
    }
    :root [hidden]:where(:not([hidden="until-found" i])) { display: none; }
    /* /OD-LAYOUT-PRIMITIVES v1 */

    :root {
      --bg: #f4f2ee;
      --surface: #fcfbf9;
      --surface-2: #efede8;
      --surface-3: #e7e4dd;
      --fg: #1b1c1e;
      --fg-2: #414449;
      --muted: #5c6066;
      --meta: #6b6e73;
      --border: rgba(27, 28, 30, 0.11);
      --border-soft: rgba(27, 28, 30, 0.065);
      --border-strong: rgba(27, 28, 30, 0.2);
      --accent: #315fce;
      --accent-on: #ffffff;
      --accent-hover: #274fae;
      --accent-soft: rgba(49, 95, 206, 0.1);
      --brand: #c9483f;
      --success: #2d7354;
      --warn: #94620f;
      --danger: #ad3d34;
      --danger-soft: rgba(173, 61, 52, 0.08);
      --info: #2b66b4;
      --plan-ink: #315fce;
      --actual-ink: #9b5b13;
      --energy-deep: #1f6f78;
      --energy-fragmented: #b98521;
      --energy-low: #786481;
      --shadow-pop: 0 14px 44px rgba(31, 28, 23, 0.17), 0 2px 8px rgba(31, 28, 23, 0.08), 0 0 0 1px var(--border);
      --backdrop: rgba(22, 21, 19, 0.28);
      --focus-ring: 0 0 0 3px rgba(49, 95, 206, 0.24);
      --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, "SF Mono", SFMono-Regular, "Roboto Mono", Menlo, Monaco, Consolas, monospace;
      --text-2xs: 9px;
      --text-xs: 10.5px;
      --text-sm: 12px;
      --text-md: 13px;
      --text-base: 14px;
      --text-lg: 16px;
      --text-xl: 20px;
      --text-2xl: 24px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --radius-pill: 999px;
      --ease: cubic-bezier(0.2, 0, 0, 1);
      --motion-fast: 120ms;
      --motion-base: 170ms;
      --hour-w: 58px;
      --energy-w: 28px;
      --row-h: 72px;
      --topbar-h: 54px;
      --toast-lift: 18px;
    }

    [data-theme="dark"] .now-line::before { color: #17191c; }
    [data-theme="dark"] {
      --bg: #111315;
      --surface: #17191c;
      --surface-2: #1e2124;
      --surface-3: #262a2e;
      --fg: #f1f0ed;
      --fg-2: #c9c8c4;
      --muted: #9a9da1;
      --meta: #7f8388;
      --border: rgba(255, 255, 255, 0.1);
      --border-soft: rgba(255, 255, 255, 0.055);
      --border-strong: rgba(255, 255, 255, 0.2);
      --accent: #7d9df2;
      --accent-on: #121417;
      --accent-hover: #96b0f8;
      --accent-soft: rgba(125, 157, 242, 0.12);
      --brand: #ef7b72;
      --success: #6fbe98;
      --warn: #dab05d;
      --danger: #ef8c83;
      --danger-soft: rgba(239, 140, 131, 0.1);
      --info: #80aef0;
      --plan-ink: #8faaf4;
      --actual-ink: #dfb168;
      --energy-deep: #23777f;
      --energy-fragmented: #b9872a;
      --energy-low: #7e678a;
      --shadow-pop: 0 18px 54px rgba(0, 0, 0, 0.5), 0 2px 10px rgba(0, 0, 0, 0.28), 0 0 0 1px var(--border);
      --backdrop: rgba(0, 0, 0, 0.54);
      --focus-ring: 0 0 0 3px rgba(125, 157, 242, 0.3);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    html { background: var(--bg); }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg-2);
      font-family: var(--font-body);
      font-size: var(--text-base);
      font-weight: 450;
      line-height: 1.45;
      letter-spacing: 0.005em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    a { color: var(--accent); }
    :focus-visible { outline: none; box-shadow: var(--focus-ring); }
    ::selection { background: var(--accent-soft); color: var(--fg); }

    .app-icon {
      width: var(--od-icon-size, 18px);
      height: var(--od-icon-size, 18px);
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: middle;
    }
    .svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .od-nowrap { white-space: nowrap; }

    .app-shell {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    /* ─── Top bar ───────────────────────────────────────────────── */
    .topbar {
      flex: none;
      height: calc(var(--topbar-h) + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 14px 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: relative;
      z-index: 40;
    }
    .topbar-left, .top-actions, .date-nav { display: flex; align-items: center; min-width: 0; }
    .topbar-left { gap: 14px; }
    .top-actions { justify-content: flex-end; gap: 2px; }
    .brand { display: flex; align-items: center; gap: 8px; flex: none; }
    .brand-mark {
      width: 24px; height: 24px; border-radius: 7px;
      display: grid; place-items: center;
      background: var(--fg); color: var(--surface);
      flex: none;
    }
    .brand-mark svg { width: 15px; height: 15px; display: block; }
    .brand-name { font-size: 12.5px; font-weight: 650; color: var(--fg); letter-spacing: 0.02em; white-space: nowrap; }

    .segmented {
      display: inline-flex;
      align-items: center;
      padding: 2px;
      gap: 1px;
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      flex: none;
    }
    .segmented button {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 6px;
      padding: 4px 9px;
      min-height: 25px;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.2;
      transition: color var(--motion-fast) var(--ease), background var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease);
    }
    .segmented button:hover { color: var(--fg); }
    .segmented button[aria-selected="true"], .segmented button[aria-pressed="true"] {
      background: var(--surface);
      color: var(--fg);
      border-color: var(--border);
      box-shadow: 0 1px 1px rgba(30, 27, 22, 0.04);
    }
    .date-nav { justify-content: center; gap: 2px; }
    .date-btn {
      border: 0; background: transparent; padding: 5px 5px; min-height: 30px;
      font-size: 12px; font-weight: 620; color: var(--fg); white-space: nowrap;
      border-radius: 6px;
    }
    .date-btn:hover { background: var(--surface-2); }
    .date-short { display: none; }
    .inline-meta {
      margin-left: 6px; padding-left: 10px;
      border-left: 1px solid var(--border);
      color: var(--meta); font-size: 10.5px; white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .icon-btn, .ghost-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 7px;
      width: 30px; height: 30px;
      padding: 0;
      flex: none;
      transition: background var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease);
    }
    .icon-btn:hover, .ghost-btn:hover { background: var(--surface-2); color: var(--fg); }
    .ghost-btn { width: auto; padding: 0 8px; height: 28px; font-size: 11px; font-weight: 600; }
    .ghost-btn[aria-pressed="false"] { color: var(--meta); }
    .icon-btn.is-on { color: var(--accent); background: var(--accent-soft); }
    .has-tip { position: relative; }
    @media (hover: hover) {
      .has-tip::after {
        content: attr(data-tip);
        position: absolute; top: calc(100% + 7px); right: 50%; transform: translateX(50%) translateY(-2px);
        background: var(--fg); color: var(--surface);
        padding: 4px 7px; border-radius: 5px;
        font-size: 10px; font-weight: 500; white-space: nowrap;
        opacity: 0; pointer-events: none;
        transition: opacity 100ms var(--ease), transform 100ms var(--ease);
        z-index: 90;
      }
      .has-tip:hover::after, .has-tip:focus-visible::after { opacity: 1; transform: translateX(50%) translateY(0); }
    }
    .top-actions .has-tip::after { right: 0; transform: translateY(-2px); }
    .top-actions .has-tip:hover::after, .top-actions .has-tip:focus-visible::after { transform: translateY(0); }

    /* ─── Week strip ────────────────────────────────────────────── */
    .week-strip {
      flex: none;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
      padding: 4px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 35;
    }
    .week-day {
      min-width: 0;
      min-height: 36px;
      padding: 3px 2px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      font-size: 9.5px; line-height: 1.15;
      transition: background var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease);
    }
    .week-day strong { display: block; font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; color: var(--fg-2); }
    .week-day:hover { background: var(--surface-2); }
    .week-day[aria-current="date"] { background: var(--accent-soft); border-color: rgba(49, 95, 206, 0.2); color: var(--accent); }
    .week-day[aria-current="date"] strong { color: var(--accent); }

    /* ─── Main / canvas ─────────────────────────────────────────── */
    .app-main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 288px;
      overflow: hidden;
      position: relative;
    }
    .canvas-panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
    .canvas-head {
      flex: none;
      height: 38px;
      padding: 0 12px 0 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--bg);
      position: relative; z-index: 25;
    }
    .canvas-head-left, .canvas-head-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .canvas-title { font-size: 11.5px; font-weight: 680; color: var(--fg); letter-spacing: 0.03em; }
    .canvas-meta { font-size: 10.5px; color: var(--meta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
    .canvas-head-right { justify-content: flex-end; flex: none; }
    .canvas-hint { font-size: 10.5px; color: var(--meta); white-space: nowrap; }
    .compare-switch { display: inline-flex; padding: 2px; gap: 1px; background: var(--surface-2); border-radius: 7px; border: 1px solid var(--border-soft); }
    .compare-switch button { border: 0; background: transparent; color: var(--muted); border-radius: 5px; padding: 3px 7px; min-height: 22px; font-size: 10.5px; font-weight: 600; }
    .compare-switch button[aria-selected="true"] { background: var(--surface); color: var(--fg); }

    .canvas-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      position: relative;
      background: var(--bg);
    }
    .canvas-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
    .canvas-scroll::-webkit-scrollbar-thumb { background: var(--surface-3); border: 3px solid var(--bg); border-radius: 999px; }
    .canvas-scroll::-webkit-scrollbar-track { background: transparent; }

    .time-head {
      position: sticky; top: 0; z-index: 18;
      display: grid;
      grid-template-columns: var(--hour-w) var(--energy-w) minmax(0, 1fr);
      height: 28px;
      background: color-mix(in srgb, var(--bg) 92%, var(--surface));
      border-bottom: 1px solid var(--border);
    }
    .time-head-label {
      display: flex; align-items: center; justify-content: flex-end;
      padding-right: 8px;
      font-family: var(--font-mono);
      font-size: 9px; color: var(--meta); letter-spacing: 0.04em;
    }
    .time-head-energy {
      display: flex; align-items: center; justify-content: center;
      border-left: 1px solid var(--border-soft);
      border-right: 1px solid var(--border-soft);
      color: var(--meta); font-size: 8px; font-weight: 700;
      writing-mode: horizontal-tb;
      overflow: hidden;
    }
    .quarter-head { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .quarter-head span {
      display: flex; align-items: center;
      padding-left: 6px;
      border-right: 1px solid var(--border-soft);
      color: var(--meta); font-family: var(--font-mono); font-size: 8.5px;
    }
    .quarter-head span:last-child { border-right: 0; }
    .quarter-head span:nth-child(2) { border-right-color: var(--border); }

    .day-grid { position: relative; }
    .hour-row {
      display: grid;
      grid-template-columns: var(--hour-w) var(--energy-w) minmax(0, 1fr);
      height: var(--row-h);
      border-bottom: 1px solid var(--border-soft);
    }
    .hour-row:last-child { border-bottom: 0; }
    .hour-row.is-current { background: rgba(217, 83, 74, 0.026); }
    .hour-label {
      display: flex; align-items: flex-start; justify-content: flex-end; gap: 2px;
      padding: 7px 8px 0 0;
      color: var(--meta);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      user-select: none;
      position: sticky; left: 0; z-index: 6;
      background: var(--bg);
    }
    .hour-label .hour-num { font-size: 12px; font-weight: 560; color: var(--fg-2); letter-spacing: -0.01em; }
    .hour-label .hour-colon { font-size: 9px; opacity: 0.65; padding-top: 2px; }
    .hour-row.is-current .hour-label .hour-num { color: var(--brand); }

    .energy-cell {
      height: 100%;
      width: 100%;
      border: 0;
      border-left: 1px solid var(--border-soft);
      border-right: 1px solid var(--border-soft);
      padding: 0;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255, 255, 255, 0.94);
      font-size: 8.5px; font-weight: 700; line-height: 1;
      letter-spacing: 0;
      position: relative;
      overflow: hidden;
      transition: filter var(--motion-fast) var(--ease);
    }
    .energy-cell:hover { filter: brightness(1.08); }
    .energy-cell:focus-visible { position: relative; z-index: 8; }
    .energy-cell[data-energy="deep"] {
      background-color: var(--energy-deep);
      background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.17) 0 3px, rgba(255,255,255,0) 3px 7px);
      text-shadow: 0 1px 1px rgba(0,0,0,0.22);
    }
    .energy-cell[data-energy="fragmented"] {
      background-color: var(--energy-fragmented);
      background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.4) 1px, rgba(255,255,255,0) 1.3px);
      background-size: 5px 5px;
      color: #211a0b;
    }
    .energy-cell[data-energy="low"] {
      background-color: var(--energy-low);
      background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.14) 0 2px, rgba(255,255,255,0) 2px 6px);
      text-shadow: 0 1px 1px rgba(0,0,0,0.22);
    }
    .energy-cell[data-energy=""] {
      background: transparent;
      color: var(--meta);
      font-size: 9px;
      font-weight: 500;
      border-bottom: 1px solid transparent;
    }
    .energy-cell[data-energy=""]::after {
      content: "";
      width: 2px; height: 2px; border-radius: 50%;
      background: currentColor; opacity: 0.42;
    }
    .hour-row:hover .energy-cell[data-energy=""] { background: var(--surface-2); }

    .hour-track {
      position: relative;
      min-width: 0;
      height: 100%;
      border-right: 1px solid var(--border-soft);
      background-image: linear-gradient(to bottom, transparent calc(100% - 1px), var(--border-soft) calc(100% - 1px));
    }
    .slot-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); z-index: 1; }
    .slot {
      min-width: 0;
      border: 0;
      border-right: 1px solid var(--border-soft);
      background: transparent;
      padding: 0;
      position: relative;
      border-radius: 0;
      transition: background var(--motion-fast) var(--ease), box-shadow var(--motion-fast) var(--ease);
      touch-action: pan-y;
    }
    .slot:nth-child(2) { border-right-color: var(--border); }
    .slot:last-child { border-right: 0; }
    .slot:hover { background: rgba(49, 95, 206, 0.045); }
    .slot.is-selected { background: var(--accent-soft); }
    .slot.is-selected::after {
      content: "";
      position: absolute; inset: 3px;
      border-radius: 5px;
      border: 1px solid rgba(49, 95, 206, 0.34);
      background: rgba(49, 95, 206, 0.055);
      pointer-events: none;
    }
    .slot:focus-visible { background: var(--accent-soft); z-index: 4; box-shadow: inset 0 0 0 2px var(--accent); }

    .segments { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
    .segment {
      position: absolute;
      pointer-events: auto;
      border: 1px solid rgba(255, 255, 255, 0.23);
      border-radius: 7px;
      background-color: var(--tag);
      background-image: linear-gradient(to right, rgba(255,255,255,0.12) 1px, transparent 1px);
      background-size: 25% 100%;
      color: #fff;
      padding: 4px 7px;
      display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px;
      overflow: hidden;
      text-align: left;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.1);
      cursor: grab;
      touch-action: manipulation;
      transition: filter var(--motion-fast) var(--ease), box-shadow var(--motion-fast) var(--ease), opacity var(--motion-fast) var(--ease);
      isolation: isolate;
    }
    .segment:hover { filter: brightness(1.045); box-shadow: 0 3px 10px rgba(20, 18, 15, 0.18); }
    .segment:active { cursor: grabbing; }
    .segment.is-selected {
      box-shadow:
        0 0 0 1px var(--bg),
        0 0 0 3px var(--accent),
        0 6px 18px rgba(20, 18, 15, 0.2);
      z-index: 7;
    }
    .segment.is-dragging { cursor: grabbing; z-index: 12; opacity: 0.9; box-shadow: 0 12px 24px rgba(20,18,15,0.28); }
    .segment.seg-compact { padding: 3px 6px; }
    .segment .seg-name {
      display: block;
      max-width: 100%;
      font-size: 12.5px; font-weight: 650; line-height: 1.15;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.16);
    }
    .segment .seg-time {
      display: block;
      max-width: 100%;
      font-family: var(--font-mono); font-size: 9px; line-height: 1.15;
      color: rgba(255, 255, 255, 0.82); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .segment .seg-note {
      display: block;
      max-width: 100%;
      font-size: 9.5px; line-height: 1.2;
      color: rgba(255, 255, 255, 0.84);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .segment.seg-compact .seg-note, .segment.seg-tiny .seg-note { display: none; }
    .segment.seg-compact .seg-time, .segment.seg-tiny .seg-time,
    .segment.is-cont-left .seg-time { display: none; }
    .segment.seg-tiny { padding: 2px 5px; }
    .segment.has-note::after {
      content: "";
      position: absolute; right: 5px; bottom: 5px;
      width: 4px; height: 4px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.12);
    }
    .segment.is-cont-left { border-top-left-radius: 3px; border-bottom-left-radius: 3px; }
    .segment.is-cont-right { border-top-right-radius: 3px; border-bottom-right-radius: 3px; }
    .segment:focus-visible { z-index: 8; box-shadow: 0 0 0 1px var(--bg), 0 0 0 3px var(--accent); }

    .now-line {
      position: absolute; top: 0; bottom: 0; width: 2px;
      background: var(--brand);
      z-index: 5;
      pointer-events: none;
      opacity: 0.9;
    }
    .now-line::before {
      content: attr(data-time);
      position: absolute; top: 2px; left: 5px;
      padding: 1px 4px;
      border-radius: 3px;
      background: var(--brand);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 8.5px;
      line-height: 1.35;
      white-space: nowrap;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    }

    /* ─── Tag shelf ─────────────────────────────────────────────── */
    .tag-shelf {
      min-width: 0; min-height: 0;
      display: flex; flex-direction: column;
      border-left: 1px solid var(--border);
      background: var(--surface);
      position: relative; z-index: 20;
    }
    .shelf-head { flex: none; padding: 11px 12px 10px; border-bottom: 1px solid var(--border-soft); }
    .shelf-kicker { font-size: 9.5px; font-weight: 700; color: var(--meta); letter-spacing: 0.07em; }
    .shelf-status { margin-top: 2px; font-size: 13px; font-weight: 620; color: var(--fg); line-height: 1.35; }
    .shelf-status .status-sub { display: block; margin-top: 2px; font-size: 10.5px; font-weight: 450; color: var(--meta); }
    .search { position: relative; margin-top: 9px; }
    .search .app-icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--meta); pointer-events: none; }
    .search input {
      width: 100%; height: 31px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      border-radius: 7px;
      padding: 0 9px 0 29px;
      font-size: 11.5px;
      outline: none;
      transition: border-color var(--motion-fast) var(--ease), box-shadow var(--motion-fast) var(--ease);
    }
    .search input::placeholder { color: var(--meta); }
    .search input:focus { border-color: var(--accent); box-shadow: var(--focus-ring); }

    .shelf-body {
      flex: 1; min-height: 0; overflow: auto; padding: 5px 7px 14px;
      transition: opacity var(--motion-base) var(--ease);
    }
    .tag-shelf.is-idle .shelf-body { filter: saturate(0.72); }
    .tag-shelf.is-idle .shelf-body:focus-within, .tag-shelf.is-idle .shelf-body:hover { filter: none; }
    .tag-group { padding: 7px 3px 8px; border-bottom: 1px solid var(--border-soft); }
    .tag-group:last-child { border-bottom: 0; }
    .tag-group-head { display: flex; align-items: center; gap: 6px; padding: 2px 4px 4px; }
    .tag-dot { width: 7px; height: 7px; border-radius: 2px; background: var(--tag-color); flex: none; }
    .tag-group-name { font-size: 11px; font-weight: 650; color: var(--fg); }
    .tag-group-count { margin-left: auto; font-size: 9.5px; color: var(--meta); font-variant-numeric: tabular-nums; }
    .tag-list { display: flex; flex-direction: column; gap: 1px; }
    .tag-btn {
      width: 100%; min-height: 28px;
      display: flex; align-items: center; gap: 7px;
      border: 1px solid transparent; border-radius: 5px;
      background: transparent; padding: 4px 6px;
      font-size: 12.5px; color: var(--fg-2); text-align: left;
      transition: background var(--motion-fast) var(--ease), border-color var(--motion-fast) var(--ease), color var(--motion-fast) var(--ease);
    }
    .tag-btn:hover { background: var(--surface-2); border-color: var(--border-soft); color: var(--fg); }
    .tag-btn.is-child { padding-left: 19px; color: var(--muted); }
    .tag-btn.is-child:hover { color: var(--fg); }
    .tag-swatch {
      width: 11px; height: 11px; border-radius: 3px;
      background: var(--tag-color);
      flex: none;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
    }
    .tag-btn .tag-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag-btn .tag-check { margin-left: auto; color: var(--accent); display: none; flex: none; }
    .tag-btn.is-current { background: var(--accent-soft); color: var(--fg); }
    .tag-btn.is-current .tag-check { display: inline-flex; }
    .shelf-empty { padding: 18px 10px; color: var(--meta); font-size: 11px; text-align: center; }
    .shelf-hint {
      flex: none;
      border-top: 1px solid var(--border-soft);
      padding: 9px 12px;
      display: flex; align-items: center; gap: 7px;
      color: var(--meta); font-size: 10px; line-height: 1.4;
    }
    .shelf-hint .app-icon { color: var(--meta); }

    /* ─── Bottom dock (variant C) ───────────────────────────────── */
    .dock {
      flex: none;
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 8px 14px calc(9px + env(safe-area-inset-bottom, 0px)) 128px;
      display: flex; flex-direction: column; gap: 6px;
      min-height: 108px;
      position: relative; z-index: 45;
    }
    .dock-status { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
    .dock-status-left { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex-wrap: wrap; }
    .dock-kicker { font-size: 9.5px; font-weight: 700; color: var(--meta); letter-spacing: 0.06em; white-space: nowrap; }
    .dock-main { font-size: 12.5px; font-weight: 620; color: var(--fg); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dock-sub { font-size: 10px; color: var(--meta); white-space: nowrap; }
    .dock-status-actions { display: flex; align-items: center; gap: 4px; flex: none; }
    .dock-note {
      width: min(210px, 36vw); height: 28px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--fg);
      padding: 0 8px; font-size: 11px; outline: none;
    }
    .dock-note:focus { border-color: var(--accent); box-shadow: var(--focus-ring); }
    .dock-rail { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
    .dock-rail::-webkit-scrollbar { display: none; }
    .dock-cat {
      flex: none; min-height: 29px;
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid transparent; border-radius: 6px;
      background: transparent; color: var(--muted);
      padding: 4px 9px; font-size: 11px; font-weight: 600;
      white-space: nowrap;
    }
    .dock-cat:hover { background: var(--surface-2); color: var(--fg); }
    .dock-cat[aria-pressed="true"] { background: var(--surface-2); border-color: var(--border); color: var(--fg); }
    .dock-tag {
      flex: none; min-height: 31px;
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--fg-2);
      padding: 5px 9px; font-size: 11.5px; white-space: nowrap;
    }
    .dock-tag:hover { background: var(--surface-2); color: var(--fg); }
    .dock-tag.is-current { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
    .dock-tag .tag-swatch { width: 9px; height: 9px; }
    .dock-tag .energy-chip { width: 18px; height: 15px; border-radius: 3px; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 7px; font-weight: 700; }
    .dock-tag .energy-chip[data-energy=""] { background: var(--surface-3); color: var(--meta); }
    .dock-tag .energy-chip[data-energy="fragmented"] { color: #211a0b; }
    .dock-energy-rail { align-items: center; }
    .dock-empty { font-size: 10.5px; color: var(--meta); padding: 6px 2px; }

    /* ─── Variant switcher ─────────────────────────────────────── */
    .variant-dock {
      position: fixed; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
      display: flex; align-items: center; gap: 1px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      box-shadow: 0 1px 4px rgba(30, 27, 22, 0.08);
    }
    .variant-dock .proto { font-size: 7px; font-weight: 700; letter-spacing: 0.08em; color: var(--meta); padding: 0 3px; }
    .variant-btn {
      width: 23px; height: 22px;
      border: 0; border-radius: 4px;
      background: transparent;
      color: var(--meta);
      font-family: var(--font-mono); font-size: 10px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0;
    }
    .variant-btn:hover { background: var(--surface-2); color: var(--fg); }
    .variant-btn[aria-current="true"] { background: var(--fg); color: var(--surface); }

    /* ─── Floating popovers ─────────────────────────────────────── */
    .floating {
      position: fixed;
      z-index: 150;
      width: 326px;
      max-height: min(560px, calc(100dvh - 24px));
      display: flex; flex-direction: column;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-pop);
      overflow: hidden;
      transform-origin: top center;
      animation: pop-in 130ms var(--ease);
    }
    @keyframes pop-in { from { opacity: 0; transform: translateY(-4px) scale(0.985); } to { opacity: 1; transform: none; } }
    .pop-head {
      flex: none;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
      padding: 12px 12px 9px;
      border-bottom: 1px solid var(--border-soft);
    }
    .pop-kicker { font-size: 9px; font-weight: 700; color: var(--meta); letter-spacing: 0.07em; }
    .pop-title { margin-top: 2px; font-size: 14px; font-weight: 680; color: var(--fg); line-height: 1.3; }
    .pop-sub { margin-top: 2px; font-size: 10.5px; color: var(--meta); font-variant-numeric: tabular-nums; }
    .pop-body { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px 12px; }
    .pop-section { margin-top: 12px; }
    .pop-section:first-child { margin-top: 0; }
    .pop-label { display: block; font-size: 9.5px; font-weight: 700; color: var(--meta); letter-spacing: 0.04em; margin-bottom: 5px; }
    .pop-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .pop-tag {
      display: inline-flex; align-items: center; gap: 5px;
      min-height: 25px; padding: 3px 7px;
      border: 1px solid var(--border); border-radius: 5px;
      background: var(--bg); color: var(--fg-2);
      font-size: 11px; white-space: nowrap;
    }
    .pop-tag:hover { background: var(--surface-2); color: var(--fg); }
    .pop-tag.is-current { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
    .pop-tag .tag-swatch { width: 9px; height: 9px; border-radius: 2px; }
    .pop-note {
      width: 100%; min-height: 54px; resize: vertical;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--fg);
      padding: 7px 8px; font-size: 11.5px; line-height: 1.45; outline: none;
    }
    .pop-note:focus { border-color: var(--accent); box-shadow: var(--focus-ring); }
    .energy-options { display: grid; gap: 3px; }
    .energy-option {
      width: 100%; min-height: 32px;
      display: flex; align-items: center; gap: 8px;
      border: 1px solid transparent; border-radius: 5px;
      background: transparent; padding: 4px 6px;
      font-size: 11px; color: var(--fg-2); text-align: left;
    }
    .energy-option:hover { background: var(--surface-2); border-color: var(--border-soft); }
    .energy-option.is-current { background: var(--accent-soft); color: var(--fg); }
    .energy-option .energy-chip {
      width: 22px; height: 16px; border-radius: 3px; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-size: 7.5px; font-weight: 700;
    }
    .energy-option .energy-chip[data-energy=""] { background: var(--surface-3); color: var(--meta); }
    .energy-option .energy-chip[data-energy="fragmented"] { color: #211a0b; }
    .energy-option small { margin-left: auto; color: var(--meta); font-size: 9.5px; }
    .pop-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 11px; margin-top: 11px; border-top: 1px solid var(--border-soft); }
    .pop-foot .danger-btn { color: var(--danger); }
    .text-btn {
      border: 0; background: transparent; padding: 5px 7px; border-radius: 5px;
      font-size: 10.5px; font-weight: 600; color: var(--muted);
    }
    .text-btn:hover { background: var(--surface-2); color: var(--fg); }
    .text-btn.danger { color: var(--danger); }
    .text-btn.danger:hover { background: var(--danger-soft); }
    .primary-btn {
      border: 1px solid var(--accent); border-radius: 6px;
      background: var(--accent); color: var(--accent-on);
      padding: 6px 12px; font-size: 11px; font-weight: 650;
    }
    .primary-btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .pop-empty { padding: 10px 4px; color: var(--meta); font-size: 11px; }

    /* ─── Mobile / responsive ──────────────────────────────────── */
    @media (max-width: 1100px) {
      .inline-meta { display: none; }
      .app-main { grid-template-columns: minmax(0, 1fr) 264px; }
    }
    @media (max-width: 900px) {
      .topbar { gap: 6px; padding-inline: 10px; }
      .brand-name { display: none; }
      .variant-dock .proto { display: none; }
      .topbar-left { gap: 9px; }
      .canvas-hint { display: none; }
      .app-main { grid-template-columns: minmax(0, 1fr); }
      .tag-shelf { display: none; }
      [data-variant="A"]:not([data-mode="compare"]) .app-main { grid-template-columns: minmax(0, 1fr) 240px; }
      [data-variant="A"]:not([data-mode="compare"]) .tag-shelf { display: flex; }
      .segmented button { padding-inline: 8px; }
      .dock { padding-left: 94px; }
    }
    @media (max-width: 720px) {
      :root { --hour-w: 48px; --energy-w: 24px; --row-h: 66px; --topbar-h: 52px; }
      .mini-btn { width: 30px; height: 30px; }
      .pop-tag { min-height: 31px; padding: 4px 8px; }
      .energy-option { min-height: 40px; }
      .dock-tag { min-height: 35px; }
      .dock-cat { min-height: 33px; }
      .week-day { min-height: 38px; }
      .tag-btn { min-height: 30px; }
      .search input { height: 35px; }
      .diff-expand { width: 28px; height: 28px; }
      .topbar { grid-template-columns: auto minmax(0, 1fr) auto; gap: 5px; padding-inline: 8px; }
      .brand { display: none; }
      .topbar-left { gap: 0; }
      .segmented button { padding-inline: 7px; font-size: 11px; }
      .date-long { display: none; }
      .date-short { display: inline; }
      .date-btn { font-size: 11px; padding-inline: 3px; }
      .icon-btn { width: 36px; height: 36px; }
      .top-actions .icon-btn { width: 38px; height: 38px; }
      .top-actions { gap: 0; }
      .canvas-head { padding-inline: 10px; gap: 5px; }
      .canvas-meta { font-size: 9.5px; }
      .canvas-title { font-size: 10.5px; }
      .ghost-btn { padding-inline: 5px; }
      .week-strip { padding: 3px 8px; gap: 2px; }
      .week-day { min-height: 34px; font-size: 9px; }
      .week-day strong { font-size: 11.5px; }
      .hour-label { padding-right: 6px; }
      .hour-label .hour-num { font-size: 11px; }
      .segment .seg-name { font-size: 11px; }
      .segment .seg-time { font-size: 8px; }
      .segment { padding-inline: 5px; }
      .now-line::before { font-size: 8px; left: 3px; }

      /* Variant A: the shelf becomes a compact bottom dock on phones. */
      [data-variant="A"]:not([data-mode="compare"]) .app-main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
      [data-variant="A"] .tag-shelf {
        display: flex;
        height: 214px;
        border-left: 0;
        border-top: 1px solid var(--border);
        padding-bottom: 42px;
      }
      [data-variant="A"] .shelf-head { padding: 7px 10px 6px; }
      [data-variant="A"] .shelf-kicker { display: none; }
      [data-variant="A"] .shelf-status { font-size: 12px; margin-top: 0; }
      [data-variant="A"] .shelf-status .status-sub { display: none; }
      [data-variant="A"] .search { margin-top: 5px; }
      [data-variant="A"] .shelf-body { padding-top: 2px; }
      [data-variant="A"] .tag-group { display: inline-flex; flex-direction: column; width: 33.33%; vertical-align: top; border-bottom: 0; padding: 3px 2px 6px; }
      [data-variant="A"] .shelf-body { display: block; white-space: nowrap; overflow-x: auto; overflow-y: hidden; }
      [data-variant="A"] .tag-group { white-space: normal; }
      [data-variant="A"] .tag-btn { padding-block: 3px; min-height: 25px; font-size: 11.5px; }
      [data-variant="A"] .tag-btn.is-child { padding-left: 16px; }
      [data-variant="A"] .tag-group-head { padding-bottom: 2px; }
      [data-variant="A"] .shelf-hint { display: none; }

      [data-variant="C"] .dock { min-height: 112px; padding: 6px 10px calc(8px + env(safe-area-inset-bottom, 0px)) 96px; gap: 4px; }
      .dock-note { width: min(150px, 34vw); }
      .dock-main { font-size: 11.5px; }
      .dock-sub { display: none; }

      .floating {
        left: 8px !important; right: 8px; top: auto !important;
        bottom: calc(var(--toast-lift, 18px) + 8px) !important;
        width: auto !important;
        max-height: min(58vh, 500px);
      }
      .variant-dock { bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
      .sheet { width: 100vw !important; max-width: 100vw !important; }
    }
    @media (max-width: 430px) {
      :root { --hour-w: 43px; --energy-w: 22px; --row-h: 64px; }
      .segmented button { padding-inline: 6px; font-size: 10.5px; }
      .date-nav .icon-btn { width: 30px; }
      .top-actions .icon-btn { width: 38px; height: 38px; }
      .canvas-head-right { gap: 2px; }
      .ghost-btn { font-size: 10px; }
      .compare-switch button { padding-inline: 5px; }
      .week-strip { gap: 0; }
      .week-day { font-size: 8.5px; }
      .dock { padding-left: 94px; }
      .dock-note { width: 120px; }
      .variant-dock .proto { display: none; }
    }

    /* ─── Sheets ────────────────────────────────────────────────── */
    dialog.sheet {
      margin: 0 0 0 auto;
      padding: 0;
      border: 0;
      border-left: 1px solid var(--border);
      width: min(660px, 100vw);
      max-width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-height: 100dvh;
      background: var(--surface);
      color: var(--fg-2);
      box-shadow: -24px 0 70px rgba(25, 22, 18, 0.15);
      overflow: hidden;
    }
    dialog.tag-sheet { width: min(460px, 100vw); }
    dialog.sheet::backdrop { background: var(--backdrop); }
    dialog.sheet[open] { animation: sheet-in 180ms var(--ease); }
    @keyframes sheet-in { from { transform: translateX(18px); opacity: 0; } to { transform: none; opacity: 1; } }
    .sheet-shell { height: 100%; display: flex; flex-direction: column; min-height: 0; }
    .sheet-head {
      flex: none;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding: 18px 20px 13px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .sheet-kicker { margin: 0 0 2px; font-size: 9.5px; font-weight: 700; letter-spacing: 0.07em; color: var(--meta); }
    .sheet-title { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 650; color: var(--fg); letter-spacing: -0.01em; }
    .sheet-sub { margin: 3px 0 0; font-size: 11px; color: var(--meta); }
    .sheet-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 20px 30px; }
    .sheet-body::-webkit-scrollbar { width: 10px; }
    .sheet-body::-webkit-scrollbar-thumb { background: var(--surface-3); border: 3px solid var(--surface); border-radius: 999px; }

    .stats-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .range-switch { display: inline-flex; padding: 2px; gap: 1px; background: var(--surface-2); border-radius: 7px; border: 1px solid var(--border-soft); }
    .range-switch button { border: 0; background: transparent; color: var(--muted); border-radius: 5px; padding: 4px 9px; min-height: 24px; font-size: 10.5px; font-weight: 600; }
    .range-switch button[aria-selected="true"] { background: var(--surface); color: var(--fg); border: 1px solid var(--border-soft); }
    .stats-summary {
      display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px;
      margin: 12px 0 2px;
      color: var(--meta); font-size: 11px;
    }
    .stats-summary strong { font-size: 22px; line-height: 1.1; font-weight: 650; color: var(--fg); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .stats-summary .sep { color: var(--border-strong); }
    .stats-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 26px; margin-top: 24px; }
    .section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; color: var(--meta); margin: 0 0 9px; }
    .stat-bars { display: flex; flex-direction: column; gap: 9px; }
    .stat-row { display: grid; grid-template-columns: 74px minmax(0, 1fr) 54px; align-items: center; gap: 8px; }
    .stat-row-label { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg-2); min-width: 0; }
    .stat-row-label span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stat-track { height: 7px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
    .stat-fill { height: 100%; background: var(--tag-color, var(--accent)); border-radius: 3px; min-width: 2px; }
    .stat-value { text-align: right; font-family: var(--font-mono); font-size: 9.5px; color: var(--meta); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .stat-children { display: flex; flex-direction: column; gap: 7px; margin-top: 7px; padding-left: 13px; }
    .stat-child-row { display: grid; grid-template-columns: 74px minmax(0, 1fr) 54px; align-items: center; gap: 8px; font-size: 10px; color: var(--meta); }
    .stat-child-row .stat-track { height: 4px; }
    .stat-child-row .stat-fill { opacity: 0.72; }
    .trend-box { min-width: 0; }
    .trend-svg { display: block; width: 100%; height: 132px; overflow: visible; }
    .trend-bar { fill: var(--accent); opacity: 0.62; }
    .trend-bar.is-empty { opacity: 0.16; }
    .trend-label { fill: var(--meta); font-size: 7.5px; font-family: var(--font-body); }
    .trend-total { fill: var(--fg-2); font-size: 8.5px; font-family: var(--font-mono); }
    .stats-footnote { margin-top: 18px; padding-top: 11px; border-top: 1px solid var(--border-soft); color: var(--meta); font-size: 9.5px; line-height: 1.5; }
    .empty-state { padding: 40px 12px; text-align: center; color: var(--meta); font-size: 12px; }
    .empty-state strong { display: block; margin-bottom: 4px; color: var(--fg-2); font-size: 13px; font-weight: 600; }

    /* Tag manager */
    .tag-manage-intro { margin: 0 0 14px; color: var(--meta); font-size: 11px; line-height: 1.55; }
    .manage-group { border-top: 1px solid var(--border-soft); padding: 10px 0 8px; }
    .manage-parent { display: flex; align-items: center; gap: 7px; min-height: 34px; }
    .manage-parent-name { font-size: 12px; font-weight: 650; color: var(--fg); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .manage-count { margin-left: auto; font-size: 9.5px; color: var(--meta); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .manage-actions { display: flex; align-items: center; gap: 1px; flex: none; }
    .mini-btn {
      width: 24px; height: 24px; border: 0; border-radius: 4px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; color: var(--meta); padding: 0;
    }
    .mini-btn:hover { background: var(--surface-2); color: var(--fg); }
    .mini-btn.danger:hover { color: var(--danger); background: var(--danger-soft); }
    .manage-children { display: flex; flex-direction: column; gap: 1px; margin-top: 2px; }
    .manage-child { display: flex; align-items: center; gap: 7px; min-height: 31px; padding-left: 19px; }
    .manage-child .manage-parent-name { font-size: 11.5px; font-weight: 500; color: var(--fg-2); }
    .manage-edit { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
    .manage-edit input {
      min-width: 0; flex: 1; height: 29px;
      border: 1px solid var(--accent); border-radius: 5px;
      background: var(--bg); color: var(--fg); padding: 0 7px; font-size: 11.5px; outline: none;
      box-shadow: var(--focus-ring);
    }
    .tag-add-box { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
    .tag-add-title { margin: 0 0 8px; font-size: 11px; font-weight: 650; color: var(--fg); }
    .tag-add-row { display: flex; gap: 5px; align-items: center; }
    .tag-add-row select, .tag-add-row input {
      height: 31px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--fg); padding: 0 8px; font-size: 11px; outline: none;
    }
    .tag-add-row select { width: 118px; flex: none; }
    .tag-add-row input { min-width: 0; flex: 1; }
    .tag-add-row select:focus, .tag-add-row input:focus { border-color: var(--accent); box-shadow: var(--focus-ring); }
    .color-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .color-label { font-size: 9.5px; color: var(--meta); margin-right: 2px; }
    .color-swatch { width: 22px; height: 22px; border-radius: 5px; border: 2px solid transparent; padding: 0; }
    .color-swatch[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 1px var(--surface) inset; }

    /* ─── Compare canvas ───────────────────────────────────────── */
    .compare-wrap { min-width: 0; }
    .compare-head {
      position: sticky; top: 0; z-index: 18;
      display: grid;
      grid-template-columns: var(--hour-w) minmax(0, 1fr) minmax(0, 1fr);
      background: color-mix(in srgb, var(--bg) 92%, var(--surface));
      border-bottom: 1px solid var(--border);
      min-height: 40px;
    }
    .compare-head-hours { grid-row: span 2; }
    .compare-side-head {
      min-width: 0;
      display: grid;
      grid-template-columns: var(--energy-w) minmax(0, 1fr);
      border-left: 1px solid var(--border);
    }
    .compare-side-title {
      grid-column: 1 / -1;
      display: flex; align-items: center; gap: 6px;
      padding: 3px 8px 0;
      font-size: 9.5px; font-weight: 700; color: var(--meta); letter-spacing: 0.04em;
    }
    .compare-side-title .tag-dot { width: 6px; height: 6px; }
    .compare-side-head .side-energy-head { font-size: 8px; color: var(--meta); display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--border-soft); }
    .compare-side-head .quarter-head { height: 18px; }
    .compare-body { position: relative; }
    .compare-row {
      display: grid;
      grid-template-columns: var(--hour-w) minmax(0, 1fr) minmax(0, 1fr);
      height: var(--row-h);
      border-bottom: 1px solid var(--border-soft);
    }
    .compare-row:last-child { border-bottom: 0; }
    .compare-row.is-current { background: rgba(217, 83, 74, 0.026); }
    .compare-row.is-current .hour-label .hour-num { color: var(--brand); }
    .compare-side { min-width: 0; display: grid; grid-template-columns: var(--energy-w) minmax(0, 1fr); border-left: 1px solid var(--border); }
    .compare-side .hour-track { border-right: 0; }
    .compare-row .hour-label { grid-row: 1; }
    .compare-mobile-switch { display: none; }

    [data-variant="B"] .app-main,
    [data-variant="C"] .app-main,
    [data-mode="compare"] .app-main { grid-template-columns: minmax(0, 1fr); }
    [data-energy="off"] { --energy-w: 0px; }
    [data-energy="off"] .energy-cell,
    [data-energy="off"] .time-head-energy,
    [data-energy="off"] .side-energy-head { visibility: hidden; pointer-events: none; border: 0; }
    [data-variant="B"] .tag-shelf,
    [data-variant="C"] .tag-shelf,
    [data-mode="compare"] .tag-shelf { display: none; }
    [data-mode="compare"] .dock { display: none; }
    [data-mode="compare"] .canvas-hint { display: none; }
    .diff-expand .app-icon { transition: transform var(--motion-fast) var(--ease); }
    .diff-expand[aria-expanded="true"] .app-icon { transform: rotate(90deg); }

    /* ─── Diff view ────────────────────────────────────────────── */
    .diff-view { padding: 16px 18px 30px; max-width: 1120px; }
    .diff-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .diff-summary { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px; color: var(--meta); font-size: 10.5px; }
    .diff-summary strong { color: var(--fg); font-size: 12px; font-weight: 650; }
    .diff-metric { display: inline-flex; padding: 2px; gap: 1px; border: 1px solid var(--border-soft); border-radius: 7px; background: var(--surface-2); }
    .diff-metric button { border: 0; background: transparent; color: var(--muted); border-radius: 5px; padding: 4px 8px; min-height: 23px; font-size: 10px; font-weight: 600; }
    .diff-metric button[aria-selected="true"] { background: var(--surface); color: var(--fg); }
    .composition-pair { display: flex; flex-direction: column; gap: 5px; margin-bottom: 18px; }
    .composition-line { display: grid; grid-template-columns: 38px minmax(0, 1fr); align-items: center; gap: 8px; }
    .composition-label { font-size: 9.5px; font-weight: 600; color: var(--meta); }
    .composition-bar { display: flex; height: 9px; border-radius: 3px; overflow: hidden; background: var(--surface-2); }
    .composition-seg { height: 100%; min-width: 1px; }
    .diff-list { border-top: 1px solid var(--border); }
    .diff-head {
      display: grid; grid-template-columns: minmax(110px, 1.1fr) 66px 66px 68px minmax(120px, 1fr);
      gap: 8px; align-items: center;
      padding: 7px 4px; border-bottom: 1px solid var(--border-soft);
      color: var(--meta); font-size: 9px; font-weight: 650; letter-spacing: 0.03em;
    }
    .diff-head span:nth-child(n+2) { text-align: right; }
    .diff-row {
      display: grid; grid-template-columns: minmax(110px, 1.1fr) 66px 66px 68px minmax(120px, 1fr);
      gap: 8px; align-items: center;
      min-height: 42px; padding: 5px 4px;
      border-bottom: 1px solid var(--border-soft);
    }
    .diff-row.is-child { min-height: 34px; background: color-mix(in srgb, var(--surface) 40%, transparent); }
    .diff-cat { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; color: var(--fg); }
    .diff-cat.is-child { padding-left: 18px; font-size: 10.5px; color: var(--muted); }
    .diff-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .diff-expand { width: 19px; height: 19px; border: 0; border-radius: 4px; background: transparent; color: var(--meta); display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: none; }
    .diff-expand:hover { background: var(--surface-2); color: var(--fg); }
    .diff-num { text-align: right; font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .diff-delta { text-align: right; font-family: var(--font-mono); font-size: 10px; font-weight: 600; color: var(--fg-2); white-space: nowrap; }
    .diff-delta.is-plus { color: var(--accent); }
    .diff-delta.is-minus { color: var(--energy-low); }
    .diff-bar { position: relative; height: 14px; min-width: 0; }
    .diff-bar::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--border-strong); }
    .diff-fill { position: absolute; top: 4px; height: 6px; border-radius: 2px; min-width: 1px; }
    .diff-fill.is-plus { left: 50%; background: var(--accent); opacity: 0.78; }
    .diff-fill.is-minus { right: 50%; background: var(--energy-low); opacity: 0.78; }
    .diff-fill.is-zero { left: 50%; width: 2px !important; opacity: 0.3; }
    .diff-legend { display: flex; align-items: center; gap: 12px; margin-top: 10px; color: var(--meta); font-size: 9px; flex-wrap: wrap; }
    .diff-legend span { display: inline-flex; align-items: center; gap: 4px; }
    .legend-swatch { width: 8px; height: 8px; border-radius: 2px; }
    .compare-empty { padding: 60px 20px; text-align: center; color: var(--meta); font-size: 12px; }

    /* ─── Toast ─────────────────────────────────────────────────── */
    .toast {
      position: fixed; left: 50%; bottom: calc(var(--toast-lift) + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%) translateY(5px);
      z-index: 220;
      display: flex; align-items: center; gap: 13px;
      min-height: 34px; max-width: min(92vw, 520px);
      padding: 7px 8px 7px 12px;
      background: var(--fg); color: var(--surface);
      border-radius: 7px;
      box-shadow: 0 8px 28px rgba(20, 18, 15, 0.22);
      font-size: 11px; line-height: 1.35;
      opacity: 0;
      transition: opacity 140ms var(--ease), transform 140ms var(--ease);
      pointer-events: none;
    }
    .toast.is-on { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .toast button {
      flex: none; border: 0; background: transparent; color: var(--surface);
      text-decoration: underline; text-underline-offset: 2px;
      font-size: 10.5px; font-weight: 650; padding: 3px 4px; border-radius: 4px;
    }
    .toast button:hover { opacity: 0.78; }

    @media (max-width: 900px) {
      .compare-mobile-switch { display: inline-flex; align-items: center; }
      .compare-mobile-switch .segmented button { min-height: 22px; padding: 3px 7px; font-size: 10px; }
      .compare-head { grid-template-columns: var(--hour-w) minmax(0, 1fr); }
      .compare-row { grid-template-columns: var(--hour-w) minmax(0, 1fr); }
      .compare-wrap[data-mobile-side="plan"] .actual-side-head,
      .compare-wrap[data-mobile-side="plan"] .actual-side,
      .compare-wrap[data-mobile-side="actual"] .plan-side-head,
      .compare-wrap[data-mobile-side="actual"] .plan-side { display: none; }
      .compare-wrap[data-mobile-side="plan"] .plan-side-head,
      .compare-wrap[data-mobile-side="actual"] .actual-side-head { border-left: 1px solid var(--border); }
    }
    @media (max-width: 720px) {
      [data-mode="compare"] #energyToggle { display: none; }
      [data-mode="compare"] .canvas-meta { display: none; }
      .diff-view { padding: 12px 10px 24px; }
      .diff-head { display: none; }
      .diff-row { grid-template-columns: minmax(0, 1fr) 49px 49px 55px; gap: 5px; padding: 8px 2px; }
      .diff-bar { grid-column: 1 / -1; margin: 2px 0 0 20px; height: 10px; }
      .diff-cat { font-size: 11px; }
      .diff-cat.is-child { padding-left: 16px; }
      .diff-num, .diff-delta { font-size: 9px; }
      .composition-pair { margin-bottom: 14px; }
      .stats-grid { grid-template-columns: minmax(0, 1fr); gap: 22px; }
      .sheet-head { padding: 14px 14px 11px; }
      .sheet-body { padding: 12px 14px 26px; }
      .stats-summary strong { font-size: 19px; }
      .stat-row, .stat-child-row { grid-template-columns: 66px minmax(0, 1fr) 54px; }
      .tag-add-row select { width: 108px; }
      .tag-add-row { flex-wrap: wrap; }
      .tag-add-row input { min-width: 120px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>

  </svg>

  <div class="app-shell" id="app">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand" aria-label="小秘书">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none">
              <rect x="2" y="2" width="6.2" height="6.2" rx="1.4" fill="currentColor" opacity=".95"/>
              <rect x="11.8" y="2" width="6.2" height="6.2" rx="1.4" fill="currentColor" opacity=".55"/>
              <rect x="2" y="11.8" width="6.2" height="6.2" rx="1.4" fill="currentColor" opacity=".55"/>
              <rect x="11.8" y="11.8" width="6.2" height="6.2" rx="1.4" fill="var(--brand)"/>
            </svg>
          </span>
          <span class="brand-name">小秘书</span>
        </div>
        <div class="segmented mode-switch" role="tablist" aria-label="视图">
          <button type="button" role="tab" data-action="mode" data-mode="plan" aria-selected="false">计划</button>
          <button type="button" role="tab" data-action="mode" data-mode="actual" aria-selected="true">实际</button>
          <button type="button" role="tab" data-action="mode" data-mode="compare" aria-selected="false">对照</button>
        </div>
      </div>

      <div class="date-nav" aria-label="日期导航">
        <button type="button" class="icon-btn" data-action="prev-day" aria-label="前一天" data-tip="前一天">
          <svg class="od-icon app-icon" style="--od-icon-size:16px"><use href="#i-chevron-left"/></svg>

  const dateKey = (date) => `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;

  };

  const sameDay = (a, b) => dateKey(a) === dateKey(b);
  const fmtTime = (minutes) => `${pad2(Math.floor(minutes / 60))}:${pad2(minutes % 60)}`;

    const safe = Math.max(0, Math.round(minutes));

    const mins = safe % 60;
    if (hours && mins) return `${hours} 小时 ${mins} 分`;
    if (hours) return `${hours} 小时`;
    return `${mins} 分钟`;

  const fmtShort = (minutes) => {
    const safe = Math.max(0, Math.round(minutes));

    if (hours && mins) return `${hours}h ${mins}m`;

  const fmtPp = (value) => {
    if (Math.abs(value) < 0.05) return "0pp";

  const escapeHTML = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"

  function mixHex(hex, target, amount) {
    const parse = (value) => {

      return [parseInt(clean.slice(0, 2), 16), parseInt(clean.slice(2, 4), 16), parseInt(clean.slice(4, 6), 16)];
    };
    const a = parse(hex);
    const b = parse(target);
    const mixed = a.map((channel, index) => Math.round(channel + (b[index] - channel) * amount));
    return `#${mixed.map((channel) => channel.toString(16).padStart(2, "0")).join("")}`;
  }
  function variantColor(base, index) {
    const variants = [-0.13, 0.09, -0.24, 0.17, -0.32];

  function tagById(id) {
    return tags.find((tag) => tag.id === id) || null;
  }
  function parentTags() {
    return tags.filter((tag) => !tag.parent);
  }
  function childrenOf(parentId) {
    return tags.filter((tag) => tag.parent === parentId);

    const tag = tagById(tagId);

    const tag = tagById(tagId);

      const record = records.find((item) => item.id === id);

    }
    return null;
  }
  function totalMinutes(records) {
    return records.reduce((sum, record) => sum + record.duration, 0);
  }
  function aggregateByTag(records) {
    const exact = new Map();
    for (const record of records) {
      exact.set(record.tagId, (exact.get(record.tagId) || 0) + record.duration);
    }
    const parents = new Map();
    const parentDirect = new Map();
    for (const parent of parentTags()) {
      let sum = exact.get(parent.id) || 0;
      for (const child of childrenOf(parent.id)) sum += exact.get(child.id) || 0;
      parents.set(parent.id, sum);
      parentDirect.set(parent.id, exact.get(parent.id) || 0);
    }
    return { exact, parents, parentDirect };
  }
  function snapshot() {
    return JSON.stringify({ tags, plan, actual, planEnergy, actualEnergy });
  }

      const data = JSON.parse(entry.data);

    toast(`已撤销：${entry.label}`);
