  function periodDays(range, date) {
    if (range === "day") return [new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12)];
    if (range === "week") {
      const start = startOfWeek(date);
      return Array.from({ length: 7 }, (_, index) => addDays(start, index));
    }
    const end = new Date(date.getFullYear(), date.getMonth() + 1, 0, 12);
    const days = [];
    for (let day = 1; day <= end.getDate(); day += 1) {
      days.push(new Date(date.getFullYear(), date.getMonth(), day, 12));
    }
    return days;
  }
  function rangeLabel(range, date) {
    if (range === "day") return `${date.getMonth() + 1} 月 ${date.getDate()} 日，${WEEKDAY_LONG[date.getDay()]}`;
    if (range === "week") {
      const days = periodDays("week", date);
      const start = days[0];
      const end = days[6];
      return `${start.getMonth() + 1} 月 ${start.getDate()} 日 – ${end.getMonth() + 1} 月 ${end.getDate()} 日`;
    }
    return `${date.getFullYear()} 年 ${date.getMonth() + 1} 月`;
  }

  function statsFor(source, range, date) {
    const days = periodDays(range, date);
    const rows = [];
    let total = 0;
    let activeDays = 0;
    const exactTotal = new Map();
    for (const day of days) {
      const records = recordsFor(source, day);
      const dayTotal = totalMinutes(records);
      total += dayTotal;
      if (dayTotal > 0) activeDays += 1;
      rows.push({ date: day, total: dayTotal });
      for (const record of records) {
        exactTotal.set(record.tagId, (exactTotal.get(record.tagId) || 0) + record.duration);
      }
    }
    const categories = parentTags().map((parent) => {
      let parentTotal = exactTotal.get(parent.id) || 0;
      const direct = exactTotal.get(parent.id) || 0;
      const children = childrenOf(parent.id).map((child) => {
        const value = exactTotal.get(child.id) || 0;
        parentTotal += value;
        return { tag: child, value };
      }).filter((child) => child.value > 0);
      return { tag: parent, total: parentTotal, children, direct };
    }).filter((row) => row.total > 0).sort((a, b) => b.total - a.total);
    return { days, rows, categories, total, activeDays, exactTotal };
  }

  function toast(message, { undoAction = false, duration = 4200 } = {}) {
    const el = $("#toast");
    if (!el) return;
    if (state.toastTimer) clearTimeout(state.toastTimer);
    el.innerHTML = `<span>${escapeHTML(message)}</span>${undoAction ? '<button type="button" data-action="undo">撤销</button>' : ""}`;
    el.hidden = false;
    requestAnimationFrame(() => el.classList.add("is-on"));
    state.toastTimer = setTimeout(() => {
      el.classList.remove("is-on");
      state.toastTimer = setTimeout(() => { el.hidden = true; }, 170);
    }, duration);
  }

  function clearSelection() {
    state.selection = null;
    state.anchorSlot = null;
    state.selectedRecordId = null;
    state.selectedRecordSide = null;
    state.selectedRecordDate = null;
  }

  function selectionInfo() {
    if (!state.selection) return null;
    const start = state.selection.start;
    const end = state.selection.end;
    return {
      start,
      end,
      duration: end - start,
      title: fmtMin(end - start),
      sub: `${fmtTime(start)}–${fmtTime(end)}`
    };
  }

  function setSelection(start, end, { openPicker = false, anchorEl = null } = {}) {
    const safeStart = clamp(Math.min(start, end), 0, 1425);
    const safeEnd = clamp(Math.max(start, end), safeStart + 15, 1440);
    state.selection = { start: safeStart, end: safeEnd };
    state.selectedRecordId = null;
    state.selectedRecordSide = null;
    state.selectedRecordDate = null;
    updateSelectionUI();
    updateLiveSelectionText();
    if (state.variant === "C") renderDock();
    if (openPicker && state.variant === "B") openTagPicker(anchorEl);
    updateFloatLift();
  }

  function updateSelectionUI() {
    const selection = state.selection;
    for (const slot of $$(".slot")) {
      const minute = Number(slot.dataset.start);
      const selected = Boolean(selection && minute >= selection.start && minute < selection.end);
      slot.classList.toggle("is-selected", selected);
      slot.setAttribute("aria-pressed", selected ? "true" : "false");
    }
    for (const segment of $$(".segment")) {
      segment.classList.toggle("is-selected", segment.dataset.record === state.selectedRecordId);
    }
  }

  function updateLiveSelectionText() {
    const info = selectionInfo();
    const shelfStatus = $("#shelfStatus");
    if (shelfStatus) {
      if (state.selectedRecordId) {
        const found = findRecord(state.selectedRecordId);
        if (found) {
          shelfStatus.innerHTML = `正在编辑<span class="status-sub">${escapeHTML(tagName(found.record.tagId, true))} · ${fmtTime(found.record.start)}–${fmtTime(found.record.start + found.record.duration)}</span>`;
        }
      } else if (info) {
        shelfStatus.innerHTML = `已选 ${escapeHTML(info.title)}<span class="status-sub">${info.sub} · 点标签立即标记</span>`;
      } else {
        shelfStatus.innerHTML = `拖动时间格，然后点标签<span class="status-sub">每个格子代表 15 分钟</span>`;
      }
    }
    const dockKicker = $("#dockKicker");
    const dockMain = $("#dockMain");
    const dockSub = $("#dockSub");
    if (dockKicker && dockMain) {
      if (state.selectedRecordId) {
        const found = findRecord(state.selectedRecordId);
        if (found) {
          dockKicker.textContent = "正在编辑";
          dockMain.textContent = tagName(found.record.tagId, true);
          dockSub.textContent = `${fmtTime(found.record.start)}–${fmtTime(found.record.start + found.record.duration)}`;
        }
      } else if (info) {
        dockKicker.textContent = "已选";
        dockMain.textContent = info.title;
        dockSub.textContent = info.sub;
      } else {
        dockKicker.textContent = "拖选时间";
        dockMain.textContent = "然后点下方标签";
        dockSub.textContent = "每格 15 分钟";
      }
    }
  }

  function getFloatLift() {
    if (state.mode === "compare") return 16;
    if (state.variant === "C") return ($("#dock")?.offsetHeight || 110) + 10;
    if (state.variant === "A" && window.innerWidth <= 720) return ($("#tagShelf")?.offsetHeight || 210) + 10;
    if (state.variant === "B" && window.innerWidth <= 720) return 52;
    return 16;
  }

  function updateFloatLift() {
    document.documentElement.style.setProperty("--toast-lift", `${getFloatLift()}px`);
  }

  function icon(name, size = 16) {
    return `<svg class="od-icon app-icon" style="--od-icon-size:${size}px" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  }

  function updateChrome() {
    const root = document.documentElement;
    root.dataset.variant = state.variant;
    root.dataset.mode = state.mode;
    root.dataset.theme = state.theme;
    root.dataset.energy = state.showEnergy ? "on" : "off";
    root.style.colorScheme = state.theme;

    $$(".mode-switch button").forEach((button) => {
      button.setAttribute("aria-selected", button.dataset.mode === state.mode ? "true" : "false");
    });
    $$(".variant-btn").forEach((button) => {
      button.setAttribute("aria-current", button.dataset.variant === state.variant ? "true" : "false");
    });
    $("#dateLong").textContent = `${state.date.getFullYear()} 年 ${state.date.getMonth() + 1} 月 ${state.date.getDate()} 日，${WEEKDAY_LONG[state.date.getDay()]}`;
    $("#dateShort").textContent = `${state.date.getMonth() + 1}/${state.date.getDate()} ${WEEKDAY_LONG[state.date.getDay()]}`;

    const actualRecords = recordsFor("actual", state.date);
    const planRecords = recordsFor("plan", state.date);
    const actualTotal = totalMinutes(actualRecords);
    const planTotal = totalMinutes(planRecords);
    const topMeta = $("#topMeta");
    if (state.mode === "compare") {
      topMeta.textContent = `计划 ${fmtShort(planTotal)} · 实际 ${fmtShort(actualTotal)}`;
      $("#canvasTitle").textContent = "对照";
      $("#canvasMeta").textContent = `计划 ${fmtShort(planTotal)} · 实际 ${fmtShort(actualTotal)}`;
      $("#canvasHint").textContent = "";
      $("#statsBtn").setAttribute("aria-label", "打开实际统计");
      $("#statsBtn").setAttribute("data-tip", "实际统计");
    } else if (state.mode === "plan") {
      topMeta.textContent = `每周${WEEKDAY_SHORT[state.date.getDay()]} · ${fmtShort(planTotal)}`;
      $("#canvasTitle").textContent = "计划";
      $("#canvasMeta").textContent = `${fmtMin(planTotal)} · 每周重复模板`;
      $("#canvasHint").textContent = "";
      $("#statsBtn").setAttribute("aria-label", "打开计划统计");
      $("#statsBtn").setAttribute("data-tip", "计划统计");
    } else {
      topMeta.textContent = fmtMin(actualTotal);
      $("#canvasTitle").textContent = "实际";
      $("#canvasMeta").textContent = actualTotal > 0 ? `${fmtMin(actualTotal)} · ${actualRecords.length} 条记录` : "还没有记录 · 拖选时间格开始补记";
      $("#canvasHint").textContent = state.variant === "B" ? "拖选时间，标签会出现在选择旁" : "";
      $("#statsBtn").setAttribute("aria-label", "打开实际统计");
      $("#statsBtn").setAttribute("data-tip", "实际统计");
    }

    $("#weekStrip").hidden = state.mode !== "plan";
    $("#compareSwitch").hidden = state.mode !== "compare";
    $$("#compareSwitch button").forEach((button) => {
      button.setAttribute("aria-selected", button.dataset.view === state.compareView ? "true" : "false");
    });
    const energyButton = $("#energyToggle");
    energyButton.hidden = state.mode === "compare" && state.compareView === "diff";
    energyButton.setAttribute("aria-pressed", state.showEnergy ? "true" : "false");
    energyButton.innerHTML = `${icon(state.showEnergy ? "eye" : "eye-off", 14)}<span>精力</span>`;

    const themeButton = $("#themeBtn");
    themeButton.innerHTML = icon(state.theme === "light" ? "moon" : "sun", 17);
    themeButton.setAttribute("aria-label", state.theme === "light" ? "切换到深色" : "切换到浅色");

    let sideSwitch = $("#compareSideSwitch");
    if (state.mode === "compare" && state.compareView === "canvas") {
      if (!sideSwitch) {
        sideSwitch = document.createElement("div");
        sideSwitch.id = "compareSideSwitch";
        sideSwitch.className = "compare-mobile-switch";
        sideSwitch.setAttribute("role", "group");
        sideSwitch.setAttribute("aria-label", "窄屏对照侧");
        $("#energyToggle").before(sideSwitch);
      }
      sideSwitch.hidden = false;
      sideSwitch.innerHTML = `<div class="segmented">
        <button type="button" data-action="compare-side" data-side="plan" aria-selected="${state.compareSide === "plan"}">计划</button>
        <button type="button" data-action="compare-side" data-side="actual" aria-selected="${state.compareSide === "actual"}">实际</button>
      </div>`;
    } else if (sideSwitch) {
      sideSwitch.hidden = true;
    }
  }

  function renderWeekStrip() {
    const strip = $("#weekStrip");
    if (state.mode !== "plan") {
      strip.hidden = true;
      return;
    }
    strip.hidden = false;
    const start = startOfWeek(state.date);
    strip.innerHTML = Array.from({ length: 7 }, (_, index) => {
      const day = addDays(start, index);
      const selected = sameDay(day, state.date);
      return `<button type="button" class="week-day" data-action="week-day" data-date="${dateKey(day)}" ${selected ? 'aria-current="date"' : ""}>
        <span>周${WEEKDAY_SHORT[day.getDay()]}</span><strong>${day.getDate()}</strong>
      </button>`;
    }).join("");
  }

  function energyCellHTML(side, date, hour) {
    const map = energyFor(side, date);
    const value = map[String(hour)] || "";
    const meta = ENERGY_META[value] || ENERGY_META[""];
    return `<button type="button" class="energy-cell" data-action="open-energy" data-side="${side}" data-hour="${hour}" data-energy="${value}" aria-label="${hour}:00 ${meta.label}，点击标注精力" title="${hour}:00 · ${meta.label}">${value ? meta.short : ""}</button>`;
  }

  function slotHTML(side, date, start, { interactive = true } = {}) {
    const selected = Boolean(state.selection && start >= state.selection.start && start < state.selection.end);
    return `<button type="button" class="slot${selected ? " is-selected" : ""}" data-start="${start}" data-side="${side}" data-date="${dateKey(date)}" ${interactive ? "" : 'tabindex="-1"'} aria-pressed="${selected}" aria-label="选择 ${fmtTime(start)} 到 ${fmtTime(start + 15)}"></button>`;
  }

  function segmentHTML(side, date, segment, laneCount) {
    const record = segment.record;
    const color = tagColor(record.tagId);
    const duration = segment.end - segment.start;
    const widthPct = (duration / 60) * 100;
    const compact = laneCount > 1 || widthPct < 34;
    const tiny = widthPct < 24;
    const lane = segment.lane;
    const top = laneCount > 1 ? `calc(${lane * 50}% + 3px)` : "3px";
    const height = laneCount > 1 ? "calc(50% - 5px)" : "calc(100% - 6px)";
    const note = record.note ? ` · ${record.note}` : "";
    const title = `${tagName(record.tagId, true)} ${fmtTime(record.start)}–${fmtTime(record.start + record.duration)}${note}`;
    const showNote = record.note && segment.start === record.start && widthPct >= 50 && laneCount === 1;
    return `<button type="button" class="segment${compact ? " seg-compact" : ""}${tiny ? " seg-tiny" : ""}${record.note ? " has-note" : ""}${segment.start > record.start ? " is-cont-left" : ""}${segment.end < record.start + record.duration ? " is-cont-right" : ""}${record.id === state.selectedRecordId ? " is-selected" : ""}"
      data-record="${record.id}" data-side="${side}" data-date="${dateKey(date)}"
      style="--tag:${color};left:${segment.left + 0.12}%;width:${Math.max(segment.width - 0.24, 1)}%;top:${top};height:${height}"
      title="${escapeAttr(title)}" aria-label="${escapeAttr(title)}">
      <span class="seg-name">${escapeHTML(tagName(record.tagId))}</span>
      <span class="seg-time">${fmtTime(record.start)}–${fmtTime(record.start + record.duration)}</span>
      ${showNote ? `<span class="seg-note">${escapeHTML(record.note)}</span>` : ""}
    </button>`;
  }

  function trackHTML(side, date, hour, records, { interactive = true } = {}) {
    const hourStart = hour * 60;
    const segments = [];
    for (const record of records) {
      const start = Math.max(record.start, hourStart);
      const end = Math.min(record.start + record.duration, hourStart + 60);
      if (end <= start) continue;
      segments.push({
        record,
        start,
        end,
        left: ((start - hourStart) / 60) * 100,
        width: ((end - start) / 60) * 100
      });
    }
    segments.sort((a, b) => a.start - b.start || a.record.id.localeCompare(b.record.id));
    const laneEnds = [-1, -1];
    for (const segment of segments) {
      let lane = laneEnds.findIndex((end) => end <= segment.start);
      if (lane === -1) lane = laneEnds[0] <= laneEnds[1] ? 0 : 1;
      segment.lane = lane;
      laneEnds[lane] = segment.end;
    }
    const laneCount = segments.length ? Math.max(...segments.map((segment) => segment.lane)) + 1 : 1;
    const now = side === "actual" && sameDay(date, TODAY) && hour === Math.floor(NOW_MIN / 60);
    const slots = Array.from({ length: 4 }, (_, index) => slotHTML(side, date, hourStart + index * 15, { interactive })).join("");
    return `<div class="hour-track">
      <div class="slot-grid">${slots}</div>
      <div class="segments">${segments.map((segment) => segmentHTML(side, date, segment, laneCount)).join("")}</div>
      ${now ? `<span class="now-line" data-time="${fmtTime(NOW_MIN)}" style="left:${((NOW_MIN % 60) / 60) * 100}%"></span>` : ""}
    </div>`;
  }

  function hourRowHTML(side, date, hour, records, { interactive = true } = {}) {
    const current = side === "actual" && sameDay(date, TODAY) && hour === Math.floor(NOW_MIN / 60);
    return `<div class="hour-row${current ? " is-current" : ""}" data-hour="${hour}">
      <div class="hour-label"><span class="hour-num">${pad2(hour)}</span><span class="hour-colon">:00</span></div>
      ${energyCellHTML(side, date, hour)}
      ${trackHTML(side, date, hour, records, { interactive })}
    </div>`;
  }

  function timeHeadHTML() {
    return `<div class="time-head">
      <div class="time-head-label">时间</div>
      <div class="time-head-energy">精力</div>
      <div class="quarter-head"><span>00</span><span>15</span><span>30</span><span>45</span></div>
    </div>`;
  }

  function renderDayCanvas(side) {
    const date = state.date;
    const records = recordsFor(side, date);
    const rows = Array.from({ length: 24 }, (_, hour) => hourRowHTML(side, date, hour, records)).join("");
    return `${timeHeadHTML()}<div class="day-grid">${rows}</div>`;
  }

  function renderCompareCanvas() {
    if (state.compareView === "diff") return renderDiffView();
    const planRecords = recordsFor("plan", state.date);
    const actualRecords = recordsFor("actual", state.date);
    const header = `<div class="compare-head">
      <div class="time-head-label compare-head-hours">时间</div>
      ${["plan", "actual"].map((side) => `<div class="compare-side-head ${side}-side-head">
        <div class="compare-side-title"><span class="tag-dot" style="--tag-color:${side === "plan" ? "var(--plan-ink)" : "var(--actual-ink)"}"></span>${side === "plan" ? "计划" : "实际"}</div>
        <div class="side-energy-head">精力</div>
        <div class="quarter-head"><span>00</span><span>15</span><span>30</span><span>45</span></div>
      </div>`).join("")}
    </div>`;
    const rows = Array.from({ length: 24 }, (_, hour) => {
      const current = hour === Math.floor(NOW_MIN / 60) && sameDay(state.date, TODAY);
      return `<div class="compare-row${current ? " is-current" : ""}" data-hour="${hour}">
        <div class="hour-label"><span class="hour-num">${pad2(hour)}</span><span class="hour-colon">:00</span></div>
        <div class="compare-side plan-side">${energyCellHTML("plan", state.date, hour)}${trackHTML("plan", state.date, hour, planRecords, { interactive: false })}</div>
        <div class="compare-side actual-side">${energyCellHTML("actual", state.date, hour)}${trackHTML("actual", state.date, hour, actualRecords, { interactive: false })}</div>
      </div>`;
    }).join("");
    return `<div class="compare-wrap" data-mobile-side="${state.compareSide}">${header}<div class="compare-body">${rows}</div></div>`;
  }

  function compositionBarsHTML(planAgg, actualAgg, totalPlan, totalActual) {
    if (!totalPlan && !totalActual) return "";
    const ids = parentTags().filter((tag) => (planAgg.parents.get(tag.id) || 0) > 0 || (actualAgg.parents.get(tag.id) || 0) > 0);
    const line = (label, agg, total) => `<div class="composition-line"><span class="composition-label">${label}</span><div class="composition-bar">${ids.map((tag) => {
      const value = agg.parents.get(tag.id) || 0;
      const pct = total ? (value / total) * 100 : 0;
      return pct > 0 ? `<span class="composition-seg" style="width:${pct}%;background:${tag.color}" title="${escapeAttr(tag.name)} ${pct.toFixed(1)}%"></span>` : "";
    }).join("")}</div></div>`;
    return `<div class="composition-pair">${line("计划", planAgg, totalPlan)}${line("实际", actualAgg, totalActual)}</div>`;
  }

  function renderDiffView() {
    const planRecords = recordsFor("plan", state.date);
    const actualRecords = recordsFor("actual", state.date);
    const planTotal = totalMinutes(planRecords);
    const actualTotal = totalMinutes(actualRecords);
    const planAgg = aggregateByTag(planRecords);
    const actualAgg = aggregateByTag(actualRecords);
    const metric = state.diffMetric;
    const rows = parentTags().map((tag) => {
      const planMin = planAgg.parents.get(tag.id) || 0;
      const actualMin = actualAgg.parents.get(tag.id) || 0;
      const planValue = metric === "duration" ? planMin : (planTotal ? (planMin / planTotal) * 100 : 0);
      const actualValue = metric === "duration" ? actualMin : (actualTotal ? (actualMin / actualTotal) * 100 : 0);
      return { tag, planMin, actualMin, planValue, actualValue, delta: actualValue - planValue };
    }).filter((row) => row.planMin > 0 || row.actualMin > 0).sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
    const maxAbs = Math.max(1, ...rows.map((row) => Math.abs(row.delta)));
    const composition = metric === "share" ? compositionBarsHTML(planAgg, actualAgg, planTotal, actualTotal) : "";

    const rowHTML = (row, child = false) => {
      const isPlus = row.delta > 0.05;
      const isMinus = row.delta < -0.05;
      const barWidth = Math.min(50, (Math.abs(row.delta) / maxAbs) * 50);
      const children = [];
      const directPlan = planAgg.parentDirect.get(row.tag.id) || 0;
      const directActual = actualAgg.parentDirect.get(row.tag.id) || 0;
      if (directPlan || directActual) {
        const planValue = metric === "duration" ? directPlan : (planTotal ? (directPlan / planTotal) * 100 : 0);
        const actualValue = metric === "duration" ? directActual : (actualTotal ? (directActual / actualTotal) * 100 : 0);
        children.push({ tag: { id: `direct-${row.tag.id}`, name: "未细分", color: row.tag.color, parent: null }, planMin: directPlan, actualMin: directActual, planValue, actualValue, delta: actualValue - planValue });
      }
      children.push(...childrenOf(row.tag.id).map((childTag) => {
        const planMin = planAgg.exact.get(childTag.id) || 0;
        const actualMin = actualAgg.exact.get(childTag.id) || 0;
        const planValue = metric === "duration" ? planMin : (planTotal ? (planMin / planTotal) * 100 : 0);
        const actualValue = metric === "duration" ? actualMin : (actualTotal ? (actualMin / actualTotal) * 100 : 0);
        return { tag: childTag, planMin, actualMin, planValue, actualValue, delta: actualValue - planValue };
      }).filter((childRow) => childRow.planMin || childRow.actualMin));
      const hasChildren = children.length > 0;
      const expanded = state.expandedCats.has(row.tag.id);
      const value = (amount, raw) => metric === "duration" ? fmtShort(amount) : `${raw.toFixed(1)}%`;
      const deltaText = metric === "duration" ? fmtSigned(row.delta) : fmtPp(row.delta);
      return `<div class="diff-row${child ? " is-child" : ""}">
        <div class="diff-cat${child ? " is-child" : ""}">
          ${hasChildren && !child ? `<button type="button" class="diff-expand" data-action="toggle-cat" data-cat="${row.tag.id}" aria-label="${expanded ? "收起" : "展开"}${escapeAttr(row.tag.name)}二级标签" aria-expanded="${expanded}">${icon("chevron-right", 12)}</button>` : ""}
          <span class="tag-dot" style="--tag-color:${row.tag.color}"></span>
          <span class="diff-name">${escapeHTML(row.tag.name)}</span>
        </div>
        <div class="diff-num">${value(row.planMin, row.planValue)}</div>
        <div class="diff-num">${value(row.actualMin, row.actualValue)}</div>
        <div class="diff-delta${isPlus ? " is-plus" : isMinus ? " is-minus" : ""}">${deltaText}</div>
        <div class="diff-bar" aria-hidden="true"><span class="diff-fill ${isPlus ? "is-plus" : isMinus ? "is-minus" : "is-zero"}" style="width:${barWidth}%"></span></div>
      </div>${expanded ? children.map((item) => rowHTML(item, true)).join("") : ""}`;
    };

    if (!rows.length) {
      return `<div class="compare-empty">这一天还没有可对照的记录。<br>切回实际视图，拖选时间格开始补记。</div>`;
    }
    return `<div class="diff-view">
      <div class="diff-toolbar">
        <div class="diff-summary"><strong>计划 ${fmtShort(planTotal)}</strong><span>实际 ${fmtShort(actualTotal)}</span><span>Δ ${fmtSigned(actualTotal - planTotal)}</span></div>
        <div class="diff-metric" role="group" aria-label="差异口径">
          <button type="button" data-action="diff-metric" data-metric="duration" aria-selected="${metric === "duration"}">时长</button>
          <button type="button" data-action="diff-metric" data-metric="share" aria-selected="${metric === "share"}">构成比</button>
        </div>
      </div>
      ${composition}
      <div class="diff-head"><span>类别</span><span>计划</span><span>实际</span><span>差值</span><span>差值条</span></div>
      <div class="diff-list">${rows.map((row) => rowHTML(row)).join("")}</div>
      <div class="diff-legend">
        <span><i class="legend-swatch" style="background:var(--accent)"></i>实际多于计划</span>
        <span><i class="legend-swatch" style="background:var(--energy-low)"></i>实际少于计划</span>
        <span>差值只描述变化，不评价好坏</span>
      </div>
    </div>`;
  }

  function renderCanvas() {
    const scroller = $("#canvasScroll");
    const previousScroll = scroller.scrollTop;
    scroller.innerHTML = state.mode === "compare" ? renderCompareCanvas() : renderDayCanvas(currentSource());
    if (state.initialScroll) {
      state.initialScroll = false;
      const rowHeight = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--row-h")) || 72;
      scroller.scrollTop = Math.max(0, rowHeight * 8);
    } else {
      scroller.scrollTop = previousScroll;
    }
    updateSelectionUI();
    updateFloatLift();
  }

  function updateShelfHeader() {
    const status = $("#shelfStatus");
    if (!status) return;
    const info = selectionInfo();
    if (state.selectedRecordId) {
      const found = findRecord(state.selectedRecordId);
      if (found) {
        status.innerHTML = `正在编辑<span class="status-sub">${escapeHTML(tagName(found.record.tagId, true))} · ${fmtTime(found.record.start)}–${fmtTime(found.record.start + found.record.duration)}</span>`;
        return;
      }
    }
    if (info) {
      status.innerHTML = `已选 ${escapeHTML(info.title)}<span class="status-sub">${info.sub} · 点标签立即标记</span>`;
    } else {
      status.innerHTML = `拖动时间格，然后点标签<span class="status-sub">每个格子代表 15 分钟</span>`;
    }
  }

  function filteredGroups(search) {
    const query = search.trim().toLowerCase();
    return parentTags().map((parent) => {
      const children = childrenOf(parent.id);
      const parentMatch = !query || parent.name.toLowerCase().includes(query);
      const matchedChildren = query ? children.filter((child) => child.name.toLowerCase().includes(query)) : children;
      if (!parentMatch && matchedChildren.length === 0) return null;
      return { parent, children: parentMatch ? children : matchedChildren };
    }).filter(Boolean);
  }

  function tagButtonHTML(tag, { child = false, current = "" } = {}) {
    return `<button type="button" class="tag-btn${child ? " is-child" : ""}${tag.id === current ? " is-current" : ""}" data-action="apply-tag" data-tag="${tag.id}">
      <span class="tag-swatch" style="--tag-color:${tag.color}"></span>
      <span class="tag-name">${escapeHTML(tag.name)}</span>
      <span class="tag-check">${icon("check", 12)}</span>
    </button>`;
  }

  function renderShelfBody() {
    const container = $("#shelfBody");
    if (!container) return;
    const groups = filteredGroups(state.tagSearch);
    if (!groups.length) {
      container.innerHTML = `<div class="shelf-empty">没有匹配的标签</div>`;
      return;
    }
    const current = state.selectedRecordId ? findRecord(state.selectedRecordId)?.record.tagId : "";
    container.innerHTML = groups.map(({ parent, children }) => `
      <div class="tag-group">
        <div class="tag-group-head"><span class="tag-dot" style="--tag-color:${parent.color}"></span><span class="tag-group-name">${escapeHTML(parent.name)}</span><span class="tag-group-count">${children.length + 1}</span></div>
        <div class="tag-list">
          ${tagButtonHTML(parent, { current })}
          ${children.map((child) => tagButtonHTML(child, { child: true, current })).join("")}
        </div>
      </div>`).join("");
  }

  function renderShelf() {
    const shelf = $("#tagShelf");
    if (!shelf) return;
    shelf.classList.toggle("is-idle", !state.selection && !state.selectedRecordId);
    updateShelfHeader();
    const search = $("#shelfSearch");
    if (search && search.value !== state.tagSearch) search.value = state.tagSearch;
    renderShelfBody();
  }

  function dockTagHTML(tag, currentId = "") {
    return `<button type="button" class="dock-tag${tag.id === currentId ? " is-current" : ""}" data-action="apply-tag" data-tag="${tag.id}" aria-pressed="${tag.id === currentId}"><span class="tag-swatch" style="--tag-color:${tag.color}"></span>${escapeHTML(tag.name)}</button>`;
  }

  function renderDock() {
    const dock = $("#dock");
    if (!dock) return;
    const visible = state.variant === "C" && state.mode !== "compare";
    dock.hidden = !visible;
    if (!visible) {
      updateFloatLift();
      return;
    }
    const info = selectionInfo();
    const found = state.selectedRecordId ? findRecord(state.selectedRecordId) : null;
    const category = validCategory();
    let html = "";
    if (found) {
      const record = found.record;
      const recordEnergy = energyForRecord(record);
      html = `<div class="dock-status">
        <div class="dock-status-left">
          <span class="dock-kicker" id="dockKicker">正在编辑</span>
          <span class="dock-main" id="dockMain">${escapeHTML(tagName(record.tagId, true))}</span>
          <span class="dock-sub" id="dockSub">${fmtTime(record.start)}–${fmtTime(record.start + record.duration)}</span>
        </div>
        <div class="dock-status-actions">
          <input class="dock-note" id="dockNote" value="${escapeAttr(record.note)}" placeholder="添加备注" aria-label="记录备注">
          <button type="button" class="mini-btn danger" data-action="delete-record" aria-label="删除记录">${icon("trash", 15)}</button>
          <button type="button" class="mini-btn" data-action="clear-selection" aria-label="结束编辑">${icon("x", 15)}</button>
        </div>
      </div>
      <div class="dock-rail" aria-label="更换标签">${tags.map((tag) => dockTagHTML(tag, record.tagId)).join("")}</div>
      <div class="dock-rail dock-energy-rail" aria-label="记录精力">
        <span class="dock-kicker" style="padding:0 3px">精力</span>
        ${["deep", "fragmented", "low", ""].map((key) => {
          const meta = ENERGY_META[key];
          return `<button type="button" class="dock-tag${recordEnergy === key ? " is-current" : ""}" data-action="record-energy" data-energy="${key}" aria-pressed="${recordEnergy === key}"><span class="energy-chip" data-energy="${key}" style="${key ? `background:var(--energy-${key})` : ""}">${key ? meta.short : "—"}</span>${meta.label}</button>`;
        }).join("")}
      </div>`;
    } else {
      const categoryTag = tagById(category);
      const children = childrenOf(category);
      html = `<div class="dock-status">
        <div class="dock-status-left">
          <span class="dock-kicker" id="dockKicker">${info ? "已选" : "拖选时间"}</span>
          <span class="dock-main" id="dockMain">${info ? escapeHTML(info.title) : "然后点下方标签"}</span>
          <span class="dock-sub" id="dockSub">${info ? info.sub : "每格 15 分钟"}</span>
        </div>
        <div class="dock-status-actions">${info ? `<button type="button" class="mini-btn" data-action="clear-selection" aria-label="取消选择">${icon("x", 15)}</button>` : ""}</div>
      </div>
      <div class="dock-rail" aria-label="一级类别">
        ${parentTags().map((parent) => `<button type="button" class="dock-cat" data-action="dock-category" data-category="${parent.id}" aria-pressed="${parent.id === category}"><span class="tag-dot" style="--tag-color:${parent.color}"></span>${escapeHTML(parent.name)}</button>`).join("")}
      </div>
      <div class="dock-rail" aria-label="${escapeAttr(categoryTag?.name || "二级标签")}">
        ${categoryTag ? dockTagHTML(categoryTag) : ""}
        ${children.map((child) => dockTagHTML(child)).join("")}
      </div>`;
    }
    dock.innerHTML = html;
    updateFloatLift();
  }

  function renderAll() {
    updateChrome();
    renderWeekStrip();
    renderCanvas();
    renderShelf();
    renderDock();
    updateFloatLift();
  }

  let floatingTrigger = null;

  function positionFloating(element, anchorRect) {
    if (!element || window.innerWidth <= 720) return;
    const margin = 10;
    const width = element.offsetWidth;
    const height = element.offsetHeight;
    const left = clamp(anchorRect.left, margin, window.innerWidth - width - margin);
    let top = anchorRect.bottom + 8;
    if (top + height > window.innerHeight - margin) top = Math.max(margin, anchorRect.top - height - 8);
    element.style.left = `${left}px`;
    element.style.top = `${top}px`;
  }

  function renderPickerBody() {
    const body = $("#pickerBody");
    if (!body) return;
    const groups = filteredGroups(state.pickerSearch);
    if (!groups.length) {
      body.innerHTML = `<div class="pop-empty">没有匹配的标签</div>`;
      return;
    }
    body.innerHTML = groups.map(({ parent, children }) => `
      <div class="pop-section">
        <span class="pop-label">${escapeHTML(parent.name)}</span>
        <div class="pop-tags">
          <button type="button" class="pop-tag" data-action="apply-tag" data-tag="${parent.id}"><span class="tag-swatch" style="--tag-color:${parent.color}"></span>${escapeHTML(parent.name)}</button>
          ${children.map((child) => `<button type="button" class="pop-tag" data-action="apply-tag" data-tag="${child.id}"><span class="tag-swatch" style="--tag-color:${child.color}"></span>${escapeHTML(child.name)}</button>`).join("")}
        </div>
      </div>`).join("");
  }

  function openTagPicker(anchorEl) {
    closeFloating();
    const info = selectionInfo();
    if (!info) return;
    const picker = $("#tagPicker");
    floatingTrigger = anchorEl || $(".slot.is-selected");
    picker.innerHTML = `<div class="pop-head">
      <div><div class="pop-kicker">标记时间</div><div class="pop-title">${escapeHTML(info.title)}</div><div class="pop-sub">${info.sub}</div></div>
      <button type="button" class="mini-btn" data-action="close-popover" aria-label="关闭">${icon("x", 15)}</button>
    </div>
    <div class="pop-body">
      <div class="search" style="margin:0 0 8px">
        ${icon("search", 13)}
        <input type="search" id="pickerSearch" value="${escapeAttr(state.pickerSearch)}" placeholder="搜索标签" autocomplete="off" aria-label="搜索标签">
      </div>
      <div id="pickerBody"></div>
    </div>`;
    picker.hidden = false;
    renderPickerBody();
    const anchorRect = anchorEl ? anchorEl.getBoundingClientRect() : ($(".slot.is-selected")?.getBoundingClientRect() || { left: 80, right: 160, top: 180, bottom: 210 });
    positionFloating(picker, anchorRect);
    updateFloatLift();
    const search = $("#pickerSearch");
    if (search && window.innerWidth > 720) search.focus({ preventScroll: true });
    else picker.querySelector('[data-action="close-popover"]')?.focus({ preventScroll: true });
  }

  function recordContextDate() {
    if (state.selectedRecordDate) {
      return state.selectedRecordDate instanceof Date ? state.selectedRecordDate : fromKey(state.selectedRecordDate);
    }
    return state.date;
  }

  function energyForRecord(record) {
    const map = energyFor(state.selectedRecordSide, recordContextDate());
    const hours = [];
    const first = Math.floor(record.start / 60);
    const last = Math.floor((record.start + record.duration - 1) / 60);
    for (let hour = first; hour <= last; hour += 1) hours.push(map[String(hour)] || "");
    const unique = [...new Set(hours.filter(Boolean))];
    if (unique.length > 1) return "mixed";
    return unique[0] || "";
  }

  function renderRecordPopover() {
    const found = state.selectedRecordId ? findRecord(state.selectedRecordId) : null;
    const popover = $("#recordPopover");
    if (!found) {
      popover.hidden = true;
      return;
    }
    const record = found.record;
    const date = recordContextDate();
    const energy = energyForRecord(record);
    popover.innerHTML = `<div class="pop-head">
      <div>
        <div class="pop-kicker">${found.side === "plan" ? `每周${WEEKDAY_SHORT[date.getDay()]}计划` : "实际记录"}</div>
        <div class="pop-title">${escapeHTML(tagName(record.tagId, true))}</div>
        <div class="pop-sub">${fmtTime(record.start)}–${fmtTime(record.start + record.duration)} · ${fmtMin(record.duration)}</div>
      </div>
      <button type="button" class="mini-btn" data-action="close-popover" aria-label="关闭">${icon("x", 15)}</button>
    </div>
    <div class="pop-body">
      <div class="pop-section">
        <span class="pop-label">标签</span>
        <div class="pop-tags">
          ${tags.map((tag) => `<button type="button" class="pop-tag${tag.id === record.tagId ? " is-current" : ""}" data-action="record-tag" data-tag="${tag.id}"><span class="tag-swatch" style="--tag-color:${tag.color}"></span>${escapeHTML(tag.parent ? `${tagById(tag.parent)?.name || ""}/${tag.name}` : tag.name)}</button>`).join("")}
        </div>
      </div>
      <div class="pop-section">
        <label class="pop-label" for="recordNote">备注</label>
        <textarea class="pop-note" id="recordNote" rows="2" placeholder="补一句上下文">${escapeHTML(record.note)}</textarea>
      </div>
      <div class="pop-section">
        <span class="pop-label">精力 · 覆盖记录时段</span>
        ${energy === "mixed" ? '<div class="pop-empty" style="padding:0 0 6px">这段记录包含多种精力，选择一项会覆盖整段。</div>' : ""}
        <div class="energy-options">
          ${["deep", "fragmented", "low", ""].map((key) => {
            const meta = ENERGY_META[key];
            return `<button type="button" class="energy-option${energy === key ? " is-current" : ""}" data-action="record-energy" data-energy="${key}">
              <span class="energy-chip" data-energy="${key}" style="${key ? `background:var(--energy-${key})` : ""}">${key ? meta.short : "—"}</span>
              <span>${meta.label}</span><small>${meta.hint}</small>
            </button>`;
          }).join("")}
        </div>
      </div>
      <div class="pop-foot">
        <button type="button" class="text-btn danger" data-action="delete-record">删除记录</button>
        <button type="button" class="text-btn" data-action="close-popover">完成</button>
      </div>
    </div>`;
    popover.hidden = false;
    const segment = $(`.segment[data-record="${state.selectedRecordId}"]`);
    const anchor = segment ? segment.getBoundingClientRect() : { left: window.innerWidth / 2, right: window.innerWidth / 2, top: 180, bottom: 220 };
    positionFloating(popover, anchor);
    popover.querySelector('[data-action="close-popover"]')?.focus({ preventScroll: true });
    updateFloatLift();
  }

  function selectRecord(id, anchorEl = null) {
    const found = findRecord(id);
    if (!found) return;
    state.selectedRecordId = id;
    state.selectedRecordSide = found.side;
    state.selectedRecordDate = found.side === "plan" ? dateKey(state.date) : found.key;
    state.selection = null;
    state.anchorSlot = null;
    state.dockCategory = parentOfTag(found.record.tagId)?.id || state.dockCategory;
    updateSelectionUI();
    renderShelf();
    if (state.variant === "C") {
      closeFloating({ restoreFocus: false });
      renderDock();
      return;
    }
    renderDock();
    const segment = anchorEl || $(`.segment[data-record="${id}"]`);
    floatingTrigger = segment;
    renderRecordPopover();
    if (segment) positionFloating($("#recordPopover"), segment.getBoundingClientRect());
  }

  function refreshRecordPopover() {
    renderCanvas();
    renderShelf();
    renderDock();
    const segment = $(`.segment[data-record="${state.selectedRecordId}"]`);
    if (state.variant === "C") {
      if (segment) {
        state.selectedRecordDate = segment.dataset.date;
        state.selectedRecordSide = segment.dataset.side;
      }
      const currentTag = findRecord(state.selectedRecordId)?.record.tagId;
      if (currentTag) requestAnimationFrame(() => $(`#dock .dock-tag[data-tag="${currentTag}"]`)?.focus({ preventScroll: true }));
      return;
    }
    if (segment) {
      state.selectedRecordDate = segment.dataset.date;
      state.selectedRecordSide = segment.dataset.side;
      renderRecordPopover();
      positionFloating($("#recordPopover"), segment.getBoundingClientRect());
    } else {
      closeFloating();
    }
  }

  function closeFloating({ restoreFocus = true } = {}) {
    let hadOpen = false;
    ["tagPicker", "recordPopover", "energyPopover"].forEach((id) => {
      const el = document.getElementById(id);
      if (el && !el.hidden) hadOpen = true;
      if (el) {
        el.hidden = true;
        el.innerHTML = "";
        el.style.left = "";
        el.style.top = "";
      }
    });
    if (hadOpen && restoreFocus && floatingTrigger && document.contains(floatingTrigger)) {
      floatingTrigger.focus({ preventScroll: true });
    }
    floatingTrigger = null;
    state.suppressClick = false;
  }

  function openEnergyPopover(hour, side, anchorEl) {
    closeFloating();
    floatingTrigger = anchorEl;
    const map = energyFor(side, state.date);
    const current = map[String(hour)] || "";
    const pop = $("#energyPopover");
    pop.innerHTML = `<div class="pop-head">
      <div><div class="pop-kicker">${side === "plan" ? "计划精力" : "实际精力"}</div><div class="pop-title">${pad2(hour)}:00 – ${pad2(hour)}:59</div><div class="pop-sub">${state.date.getMonth() + 1} 月 ${state.date.getDate()} 日，${WEEKDAY_LONG[state.date.getDay()]}</div></div>
      <button type="button" class="mini-btn" data-action="close-popover" aria-label="关闭">${icon("x", 15)}</button>
    </div>
    <div class="pop-body">
      <div class="energy-options">
        ${["deep", "fragmented", "low", ""].map((key) => {
          const meta = ENERGY_META[key];
          return `<button type="button" class="energy-option${current === key ? " is-current" : ""}" data-action="energy-choice" data-energy="${key}" data-hour="${hour}" data-side="${side}">
            <span class="energy-chip" data-energy="${key}" style="${key ? `background:var(--energy-${key})` : ""}">${key ? meta.short : "—"}</span>
            <span>${meta.label}</span><small>${meta.hint}</small>
          </button>`;
        }).join("")}
      </div>
    </div>`;
    pop.hidden = false;
    positionFloating(pop, anchorEl.getBoundingClientRect());
    pop.querySelector('[data-action="close-popover"]')?.focus({ preventScroll: true });
    updateFloatLift();
  }

  function applyTag(tagId) {
    const tag = tagById(tagId);
    if (!tag) return;
    if (state.selectedRecordId) {
      const found = findRecord(state.selectedRecordId);
      if (!found || found.record.tagId === tagId) return;
      pushUndo("更改记录标签");
      found.record.tagId = tagId;
      state.dockCategory = parentOfTag(tagId)?.id || state.dockCategory;
      refreshRecordPopover();
      toast(`已改为 ${tagName(tagId, true)}`);
      return;
    }
    if (!state.selection) {
      toast("先拖动或点击时间格，再选标签");
      return;
    }
    const start = state.selection.start;
    const duration = state.selection.end - state.selection.start;
    if (!duration) return;
    pushUndo("新增记录");
    const record = { id: uid("rec"), start, duration, tagId, note: "" };
    if (state.mode === "plan") {
      plan[state.date.getDay()].push(record);
    } else {
      const key = dateKey(state.date);
      if (!actual[key]) actual[key] = [];
      actual[key].push(record);
    }
    state.selection = null;
    state.anchorSlot = null;
    state.selectedRecordId = record.id;
    state.selectedRecordSide = state.mode === "plan" ? "plan" : "actual";
    state.selectedRecordDate = dateKey(state.date);
    closeFloating();
    renderAll();
    const suffix = state.mode === "plan" ? `已加入每周${WEEKDAY_SHORT[state.date.getDay()]}计划` : `已标记 ${fmtTime(start)}–${fmtTime(start + duration)}`;
    toast(`${suffix} · ${tagName(tagId, true)}`, { undoAction: true });
  }

  function deleteSelectedRecord() {
    if (!state.selectedRecordId) return;
    const found = findRecord(state.selectedRecordId);
    if (!found) return;
    const label = `${tagName(found.record.tagId, true)} · ${fmtTime(found.record.start)}–${fmtTime(found.record.start + found.record.duration)}`;
    pushUndo("删除记录");
    if (found.side === "plan") {
      plan[found.weekday] = plan[found.weekday].filter((record) => record.id !== found.record.id);
    } else {
      actual[found.key] = actual[found.key].filter((record) => record.id !== found.record.id);
    }
    state.selectedRecordId = null;
    state.selectedRecordSide = null;
    state.selectedRecordDate = null;
    closeFloating();
    renderAll();
    toast(`已删除 ${label}`, { undoAction: true });
  }

  function applyEnergy(side, date, hour, energy) {
    const map = energyFor(side, date);
    if ((map[String(hour)] || "") === energy) return;
    pushUndo("标注精力");
    if (energy) map[String(hour)] = energy;
    else delete map[String(hour)];
    closeFloating();
    renderAll();
    toast(`精力已设为 ${ENERGY_META[energy].label}`);
  }

  function applyEnergyToRecord(energy) {
    const found = state.selectedRecordId ? findRecord(state.selectedRecordId) : null;
    if (!found) return;
    const record = found.record;
    const map = energyFor(found.side, recordContextDate());
    pushUndo("标注记录精力");
    const first = Math.floor(record.start / 60);
    const last = Math.floor((record.start + record.duration - 1) / 60);
    for (let hour = first; hour <= last; hour += 1) {
      if (energy) map[String(hour)] = energy;
      else delete map[String(hour)];
    }
    renderCanvas();
    renderShelf();
    renderDock();
    if (state.variant !== "C") renderRecordPopover();
    else requestAnimationFrame(() => $(`#dock .dock-tag[data-action="record-energy"][data-energy="${energy}"]`)?.focus({ preventScroll: true }));
    toast(`记录时段精力：${ENERGY_META[energy].label}`);
  }

  function moveRecordBy(record, deltaMinutes) {
    if (!deltaMinutes) return;
    pushUndo("移动记录");
    record.start = clamp(record.start + deltaMinutes, 0, 1440 - record.duration);
    closeFloating();
    renderAll();
    toast(`已移动到 ${fmtTime(record.start)}`, { undoAction: true });
  }

  function setMode(mode) {
    if (!["plan", "actual", "compare"].includes(mode) || state.mode === mode) return;
    state.mode = mode;
    state.selection = null;
    state.selectedRecordId = null;
    state.selectedRecordSide = null;
    state.selectedRecordDate = null;
    state.anchorSlot = null;
    state.tagSearch = "";
    state.pickerSearch = "";
    state.initialScroll = true;
    closeFloating();
    renderAll();
  }

  function setDate(date) {
    state.date = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12);
    state.selection = null;
    state.selectedRecordId = null;
    state.selectedRecordSide = null;
    state.selectedRecordDate = null;
    state.anchorSlot = null;
    state.initialScroll = true;
    closeFloating();
    renderAll();
  }

  function setVariant(variant) {
    if (!["A", "B", "C"].includes(variant) || state.variant === variant) return;
    state.variant = variant;
    state.selection = null;
    state.selectedRecordId = null;
    state.selectedRecordSide = null;
    state.selectedRecordDate = null;
    state.anchorSlot = null;
    closeFloating();
    try {
      const url = new URL(window.location.href);
      url.searchParams.set("variant", variant);
      history.replaceState(null, "", url);
    } catch (error) {
      console.warn("无法更新 URL 变体参数", error);
    }
    renderAll();
    toast(`变体 ${variant} · ${variant === "A" ? "标签架" : variant === "B" ? "纯净画布" : "底部快捷标记"}`);
  }

  function setTheme() {
    state.theme = state.theme === "light" ? "dark" : "light";
    updateChrome();
    renderCanvas();
    updateFloatLift();
  }

  function trendSVG(rows) {
    const width = 560;
    const height = 138;
    const padTop = 8;
    const padBottom = 20;
    const innerHeight = height - padTop - padBottom;
    const max = Math.max(1, ...rows.map((row) => row.total));
    const slotWidth = width / Math.max(rows.length, 1);
    const barWidth = Math.max(3, slotWidth - Math.min(8, slotWidth * 0.3));
    const labelEvery = Math.max(1, Math.ceil(rows.length / 7));
    const bars = rows.map((row, index) => {
      const barHeight = row.total ? Math.max(3, (row.total / max) * innerHeight) : 2;
      const x = index * slotWidth + (slotWidth - barWidth) / 2;
      const y = padTop + innerHeight - barHeight;
      const showLabel = index % labelEvery === 0 || index === rows.length - 1;
      return `<rect class="trend-bar${row.total ? "" : " is-empty"}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barWidth.toFixed(1)}" height="${barHeight.toFixed(1)}" rx="2"></rect>
        ${showLabel ? `<text class="trend-label" x="${(x + barWidth / 2).toFixed(1)}" y="${height - 4}" text-anchor="middle">${row.date.getMonth() + 1}/${row.date.getDate()}</text>` : ""}`;
    }).join("");
    return `<svg class="trend-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="按日记录时长趋势">${bars}</svg>`;
  }

  function renderStats() {
    const source = state.mode === "plan" ? "plan" : "actual";
    const data = statsFor(source, state.statsRange, state.date);
    const title = source === "plan" ? "计划统计" : "实际统计";
    $("#statsKicker").textContent = `统计 · ${source === "plan" ? "计划" : "实际"}`;
    $("#statsTitle").textContent = title;
    $("#statsSub").textContent = rangeLabel(state.statsRange, state.date);
    const average = data.days.length ? data.total / data.days.length : 0;
    const categoryRows = data.categories.map((row) => {
      const pct = data.total ? (row.total / data.total) * 100 : 0;
      return `<div class="stat-row">
        <div class="stat-row-label"><span class="tag-dot" style="--tag-color:${row.tag.color}"></span><span>${escapeHTML(row.tag.name)}</span></div>
        <div class="stat-track"><div class="stat-fill" style="width:${pct.toFixed(2)}%;--tag-color:${row.tag.color}"></div></div>
        <div class="stat-value">${fmtShort(row.total)} · ${pct.toFixed(0)}%</div>
      </div>
      ${row.children.length || row.direct ? `<div class="stat-children">${row.direct ? `<div class="stat-child-row">
          <span>未细分</span>
          <div class="stat-track"><div class="stat-fill" style="width:${(data.total ? (row.direct / data.total) * 100 : 0).toFixed(2)}%;--tag-color:${row.tag.color}"></div></div>
          <span class="stat-value">${fmtShort(row.direct)}</span>
        </div>` : ""}${row.children.map((child) => {
        const childPct = data.total ? (child.value / data.total) * 100 : 0;
        return `<div class="stat-child-row">
          <span>${escapeHTML(child.tag.name)}</span>
          <div class="stat-track"><div class="stat-fill" style="width:${childPct.toFixed(2)}%;--tag-color:${child.tag.color}"></div></div>
          <span class="stat-value">${fmtShort(child.value)}</span>
        </div>`;
      }).join("")}</div>` : ""}`;
    }).join("");
    const empty = data.total === 0;
    $("#statsBody").innerHTML = `<div class="stats-top">
      <div class="range-switch" role="group" aria-label="统计范围">
        ${["day", "week", "month"].map((range) => `<button type="button" data-action="stats-range" data-range="${range}" aria-selected="${state.statsRange === range}">${range === "day" ? "日" : range === "week" ? "周" : "月"}</button>`).join("")}
      </div>
      <span style="font-size:10px;color:var(--meta)">${source === "plan" ? "每周重复模板" : "实际记录"}</span>
    </div>
    ${empty ? `<div class="empty-state"><strong>这个范围还没有记录</strong>${source === "plan" ? "切到计划视图，拖选时间格建立模板。" : "切到实际视图，拖选时间格开始补记。"}</div>` : `
      <div class="stats-summary"><strong>${fmtMin(data.total)}</strong><span>记录时长</span><span class="sep">·</span><span>${data.activeDays} 天有记录</span><span class="sep">·</span><span>日均 ${fmtShort(average)}</span></div>
      <div class="stats-grid">
        <section aria-label="分类构成"><h3 class="section-label">分类构成</h3><div class="stat-bars">${categoryRows || '<div class="pop-empty">没有分类记录</div>'}</div></section>
        <section class="trend-box" aria-label="趋势"><h3 class="section-label">按日趋势</h3>${trendSVG(data.rows)}</section>
      </div>
      <p class="stats-footnote">记录时长按记录相加，并行记录分别累计；构成比分母为同侧同周期总记录时长。平均值按统计范围的自然日数计算。${source === "plan" ? " 计划为每周重复模板，切换周次仍展示同一模板。" : ""}${state.statsRange !== "day" ? " 当前周期尚未结束，数据截至 10 月 27 日 15:10。" : ""}</p>`}`;
  }

  function openStats() {
    const dialog = $("#statsDialog");
    state.statsRange = state.statsRange || "week";
    renderStats();
    if (!dialog.open) dialog.showModal();
  }

  function tagCounts() {
    const counts = new Map();
    const add = (records) => {
      for (const record of records) counts.set(record.tagId, (counts.get(record.tagId) || 0) + 1);
    };
    Object.values(plan).forEach(add);
    Object.values(actual).forEach(add);
    return counts;
  }
  function groupCount(parent, counts = tagCounts()) {
    let total = counts.get(parent.id) || 0;
    for (const child of childrenOf(parent.id)) total += counts.get(child.id) || 0;
    return total;
  }

  function renderTagManager() {
    const body = $("#tagBody");
    if (!body) return;
    const counts = tagCounts();
    const groups = parentTags().map((parent) => {
      const children = childrenOf(parent.id);
      const editing = state.tagEditing?.id === parent.id;
      const parentRow = `<div class="manage-parent">
        <span class="tag-dot" style="--tag-color:${parent.color};width:9px;height:9px"></span>
        ${editing ? `<div class="manage-edit"><input id="tagEditInput" value="${escapeAttr(state.tagEditing.value)}" aria-label="重命名${escapeAttr(parent.name)}"><button type="button" class="mini-btn" data-action="tag-save" data-id="${parent.id}" aria-label="保存">${icon("check", 14)}</button><button type="button" class="mini-btn" data-action="tag-cancel" aria-label="取消">${icon("x", 14)}</button></div>` : `<span class="manage-parent-name">${escapeHTML(parent.name)}</span>`}
        ${!editing ? `<span class="manage-count">${groupCount(parent, counts)} 条引用</span><div class="manage-actions">
          <button type="button" class="mini-btn" data-action="tag-edit" data-id="${parent.id}" aria-label="重命名${escapeAttr(parent.name)}">${icon("pencil", 14)}</button>
          <button type="button" class="mini-btn" data-action="tag-add-child" data-id="${parent.id}" aria-label="在${escapeAttr(parent.name)}下新增二级标签">${icon("plus", 14)}</button>
          <button type="button" class="mini-btn danger" data-action="tag-delete" data-id="${parent.id}" aria-label="删除${escapeAttr(parent.name)}">${icon("trash", 14)}</button>
        </div>` : ""}
      </div>`;
      const childRows = children.map((child) => {
        const childEditing = state.tagEditing?.id === child.id;
        return `<div class="manage-child">
          <span class="tag-dot" style="--tag-color:${child.color};width:7px;height:7px"></span>
          ${childEditing ? `<div class="manage-edit"><input id="tagEditInput" value="${escapeAttr(state.tagEditing.value)}" aria-label="重命名${escapeAttr(child.name)}"><button type="button" class="mini-btn" data-action="tag-save" data-id="${child.id}" aria-label="保存">${icon("check", 14)}</button><button type="button" class="mini-btn" data-action="tag-cancel" aria-label="取消">${icon("x", 14)}</button></div>` : `<span class="manage-parent-name">${escapeHTML(child.name)}</span>`}
          ${!childEditing ? `<span class="manage-count">${counts.get(child.id) || 0} 条</span><div class="manage-actions">
            <button type="button" class="mini-btn" data-action="tag-edit" data-id="${child.id}" aria-label="重命名${escapeAttr(child.name)}">${icon("pencil", 14)}</button>
            <button type="button" class="mini-btn danger" data-action="tag-delete" data-id="${child.id}" aria-label="删除${escapeAttr(child.name)}">${icon("trash", 14)}</button>
          </div>` : ""}
        </div>`;
      }).join("");
      return `<div class="manage-group">${parentRow}<div class="manage-children">${childRows || '<div class="dock-empty" style="padding-left:19px">暂无二级标签</div>'}</div></div>`;
    }).join("");

    body.innerHTML = `<p class="tag-manage-intro">标签用于标记时间，不是任务列表。一级类别决定颜色，二级内容保持同色系；删除前会检查引用。</p>
      ${groups}
      <div class="tag-add-box">
        <h3 class="tag-add-title">新增标签</h3>
        <div class="tag-add-row">
          <select id="tagAddParent" aria-label="标签归属">
            <option value="" ${!state.tagAddParent ? "selected" : ""}>新建一级类别</option>
            ${parentTags().map((parent) => `<option value="${parent.id}" ${state.tagAddParent === parent.id ? "selected" : ""}>${escapeHTML(parent.name)} / 二级</option>`).join("")}
          </select>
          <input id="tagAddName" placeholder="标签名称" maxlength="12" autocomplete="off" aria-label="标签名称">
          <button type="button" class="primary-btn" data-action="tag-add">添加</button>
        </div>
        <div class="color-row" id="tagColorRow" ${state.tagAddParent ? "hidden" : ""}>
          <span class="color-label">一级颜色</span>
          ${BASE_COLORS.map((color) => `<button type="button" class="color-swatch" style="background:${color.value}" data-action="tag-color" data-color="${color.value}" aria-label="${color.name}" aria-pressed="${state.newTagColor === color.value}"></button>`).join("")}
        </div>
      </div>`;
    if (state.tagEditing) {
      requestAnimationFrame(() => {
        const input = $("#tagEditInput");
        if (input) {
          input.focus();
          input.select();
        }
      });
    }
  }

  function openTagManager() {
    const dialog = $("#tagDialog");
    renderTagManager();
    if (!dialog.open) dialog.showModal();
  }

  function saveTagEdit(id) {
    if (!state.tagEditing || state.tagEditing.id !== id) return;
    const input = $("#tagEditInput");
    const value = (input?.value || state.tagEditing.value || "").trim();
    if (!value) {
      toast("标签名称不能为空");
      return;
    }
    const tag = tagById(id);
    if (!tag) return;
    const siblings = tags.filter((item) => item.id !== id && item.parent === tag.parent);
    if (siblings.some((item) => item.name === value)) {
      toast("同一层级下已有同名标签");
      return;
    }
    if (value === tag.name) {
      state.tagEditing = null;
      renderTagManager();
      return;
    }
    pushUndo("重命名标签");
    tag.name = value;
    state.tagEditing = null;
    renderTagManager();
    renderAll();
    toast(`已重命名为 ${value}`);
  }

  function addTag() {
    const select = $("#tagAddParent");
    const input = $("#tagAddName");
    const name = (input?.value || "").trim();
    const parentId = select?.value || "";
    if (!name) {
      toast("先填写标签名称");
      input?.focus();
      return;
    }
    if (name.length > 12) {
      toast("标签名称最多 12 个字");
      return;
    }
    const siblings = parentId ? childrenOf(parentId) : parentTags();
    if (siblings.some((tag) => tag.name === name)) {
      toast("同一层级下已有同名标签");
      return;
    }
    pushUndo("新增标签");
    if (parentId) {
      const parent = tagById(parentId);
      if (!parent) return;
      const index = childrenOf(parentId).length;
      tags.push({ id: uid("tag"), name, parent: parentId, color: variantColor(parent.color, index) });
      state.dockCategory = parentId;
    } else {
      tags.push({ id: uid("tag"), name, parent: null, color: state.newTagColor });
    }
    renderTagManager();
    renderAll();
    toast(`已添加标签 ${name}`);
    requestAnimationFrame(() => $("#tagAddName")?.focus());
  }

  function deleteTag(id) {
    const tag = tagById(id);
    if (!tag) return;
    const counts = tagCounts();
    const ownCount = counts.get(id) || 0;
    const children = childrenOf(id);
    if (children.length) {
      toast(`不能删除：先处理 ${children.length} 个二级标签`);
      return;
    }
    if (ownCount > 0) {
      toast(`不能删除：仍有 ${ownCount} 条记录引用`);
      return;
    }
    pushUndo("删除标签");
    tags = tags.filter((item) => item.id !== id);
    if (state.dockCategory === id) state.dockCategory = validCategory();
    renderTagManager();
    renderAll();
    toast(`已删除标签 ${tag.name}`);
  }

  function slotFromPoint(x, y) {
    const target = document.elementFromPoint(x, y);
    const row = target?.closest?.(".hour-row, .compare-row");
    if (!row) return null;
    const track = row.querySelector(".hour-track");
    if (!track) return null;
    const rect = track.getBoundingClientRect();
    const hour = Number(row.dataset.hour);
    if (!Number.isFinite(hour)) return null;
    const ratio = clamp((x - rect.left) / Math.max(1, rect.width), 0, 0.9999);
    return hour * 60 + Math.floor(ratio * 4) * 15;
  }

  function beginSlotSelection(event, slot) {
    if (state.mode === "compare") return;
    if (event.button !== 0 || event.metaKey || event.ctrlKey) return;
    const start = Number(slot.dataset.start);
    if (!Number.isFinite(start)) return;
    if (event.shiftKey && state.anchorSlot !== null) {
      const anchor = state.anchorSlot;
      setSelection(Math.min(anchor, start), Math.max(anchor, start) + 15);
    } else {
      state.anchorSlot = start;
      setSelection(start, start + 15);
    }
    state.pointerSelect = {
      anchor: state.anchorSlot,
      startX: event.clientX,
      startY: event.clientY,
      moved: false,
      pointerType: event.pointerType,
      pointerId: event.pointerId
    };
    if (event.pointerType !== "touch") {
      event.preventDefault();
      slot.setPointerCapture?.(event.pointerId);
    }
    if (state.variant === "C") renderDock();
  }

  function beginRecordDrag(event, segment) {
    if (event.button !== 0) return;
    const id = segment.dataset.record;
    const found = findRecord(id);
    if (!found) return;
    state.recordDrag = {
      id,
      found,
      startY: event.clientY,
      originStart: found.record.start,
      moved: false,
      delta: 0,
      pointerType: event.pointerType,
      pointerId: event.pointerId
    };
    if (event.pointerType !== "touch") {
      event.preventDefault();
      segment.setPointerCapture?.(event.pointerId);
    }
  }

  function finishRecordDrag() {
    const drag = state.recordDrag;
    if (!drag) return;
    state.recordDrag = null;
    document.body.classList.remove("is-dragging-record");
    document.querySelectorAll(".segment.is-dragging").forEach((el) => {
      el.classList.remove("is-dragging");
      el.style.transform = "";
    });
    if (!drag.moved || !drag.delta) {
      const segment = document.querySelector(`.segment[data-record="${drag.id}"]`);
      if (segment) selectRecord(drag.id, segment);
      return;
    }
    const record = findRecord(drag.id)?.record;
    if (record) moveRecordBy(record, drag.delta);
  }

  function onPointerDown(event) {
    if (event.target.closest(".floating, dialog, .topbar, .week-strip, .tag-shelf, .dock, .variant-dock")) return;
    if (state.mode === "compare" && event.target.closest(".slot")) return;
    const segment = event.target.closest(".segment");
    if (segment) {
      beginRecordDrag(event, segment);
      return;
    }
    const slot = event.target.closest(".slot");
    if (slot) beginSlotSelection(event, slot);
  }

  function onPointerMove(event) {
    if (state.recordDrag) {
      const drag = state.recordDrag;
      if (drag.pointerType === "touch") return;
      const row = document.querySelector(".hour-row, .compare-row");
      const rowHeight = row ? row.getBoundingClientRect().height : 72;
      const dy = event.clientY - drag.startY;
      if (Math.abs(dy) > 3) drag.moved = true;
      if (!drag.moved) return;
      const delta = Math.round((dy / rowHeight) * 60 / 15) * 15;
      drag.delta = delta;
      document.body.classList.add("is-dragging-record");
      const shift = (delta / 60) * rowHeight;
      document.querySelectorAll(`.segment[data-record="${drag.id}"]`).forEach((el) => {
        el.classList.add("is-dragging");
        el.style.transform = `translateY(${shift}px)`;
      });
      return;
    }
    const pointer = state.pointerSelect;
    if (!pointer) return;
    const dx = event.clientX - pointer.startX;
    const dy = event.clientY - pointer.startY;
    if (pointer.pointerType === "touch") {
      if (Math.abs(dy) > Math.abs(dx) + 6) return;
      if (Math.abs(dx) < 5) return;
    }
    const minute = slotFromPoint(event.clientX, event.clientY);
    if (minute === null) return;
    const start = Math.min(pointer.anchor, minute);
    const end = Math.max(pointer.anchor, minute) + 15;
    if (!state.selection || state.selection.start !== start || state.selection.end !== end) {
      pointer.moved = pointer.moved || minute !== pointer.anchor;
      setSelection(start, end);
    }
  }

  function onPointerUp() {
    if (state.recordDrag) {
      finishRecordDrag();
      return;
    }
    const pointer = state.pointerSelect;
    if (!pointer) return;
    state.pointerSelect = null;
    const info = selectionInfo();
    if (info) {
      if (state.variant === "B") {
        const slot = document.querySelector(`.slot[data-start="${info.start}"]`);
        openTagPicker(slot);
      } else if (state.variant === "C") {
        renderDock();
      } else {
        updateShelfHeader();
      }
    }
    updateFloatLift();
  }

  function handleAction(actionEl) {
    const action = actionEl.dataset.action;
    if (!action || actionEl.disabled) return;
    switch (action) {
      case "mode": setMode(actionEl.dataset.mode); break;
      case "set-variant": setVariant(actionEl.dataset.variant); break;
      case "prev-day": setDate(addDays(state.date, -1)); break;
      case "next-day": setDate(addDays(state.date, 1)); break;
      case "today": setDate(TODAY); break;
      case "week-day": setDate(fromKey(actionEl.dataset.date)); break;
      case "stats": openStats(); break;
      case "tags": openTagManager(); break;
      case "theme": setTheme(); break;
      case "compare-view":
        state.compareView = actionEl.dataset.view;
        closeFloating();
        renderAll();
        break;
      case "compare-side":
        state.compareSide = actionEl.dataset.side;
        updateChrome();
        renderCanvas();
        break;
      case "energy-toggle":
        state.showEnergy = !state.showEnergy;
        updateChrome();
        renderCanvas();
        break;
      case "apply-tag":
      case "record-tag":
        applyTag(actionEl.dataset.tag);
        break;
      case "close-popover": closeFloating(); break;
      case "clear-selection":
        clearSelection();
        closeFloating();
        renderAll();
        break;
      case "delete-record": deleteSelectedRecord(); break;
      case "record-energy": applyEnergyToRecord(actionEl.dataset.energy); break;
      case "open-energy": openEnergyPopover(Number(actionEl.dataset.hour), actionEl.dataset.side, actionEl); break;
      case "energy-choice": applyEnergy(actionEl.dataset.side, state.date, Number(actionEl.dataset.hour), actionEl.dataset.energy); break;
      case "undo": undo(); break;
      case "stats-range":
        state.statsRange = actionEl.dataset.range;
        renderStats();
        break;
      case "diff-metric":
        state.diffMetric = actionEl.dataset.metric;
        renderCanvas();
        break;
      case "toggle-cat": {
        const id = actionEl.dataset.cat;
        if (state.expandedCats.has(id)) state.expandedCats.delete(id);
        else state.expandedCats.add(id);
        renderCanvas();
        break;
      }
      case "dock-category":
        state.dockCategory = actionEl.dataset.category;
        renderDock();
        break;
      case "tag-edit":
        state.tagEditing = { id: actionEl.dataset.id, value: tagById(actionEl.dataset.id)?.name || "" };
        renderTagManager();
        break;
      case "tag-save": saveTagEdit(actionEl.dataset.id); break;
      case "tag-cancel":
        state.tagEditing = null;
        renderTagManager();
        break;
      case "tag-delete": deleteTag(actionEl.dataset.id); break;
      case "tag-add": addTag(); break;
      case "tag-add-child":
        state.tagAddParent = actionEl.dataset.id;
        state.tagEditing = null;
        renderTagManager();
        requestAnimationFrame(() => $("#tagAddName")?.focus());
        break;
      case "tag-color":
        state.newTagColor = actionEl.dataset.color;
        state.tagAddParent = "";
        renderTagManager();
        break;
      default: break;
    }
  }

  function onDocumentClick(event) {
    if (event.target instanceof HTMLDialogElement && event.target.open) {
      const rect = event.target.getBoundingClientRect();
      if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) {
        event.target.close();
        return;
      }
    }
    const closeButton = event.target.closest("[data-close]");
    if (closeButton) {
      document.getElementById(closeButton.dataset.close)?.close();
      return;
    }
    const actionEl = event.target.closest("[data-action]");
    if (actionEl) {
      if (actionEl.matches("button, a")) event.preventDefault();
      handleAction(actionEl);
      return;
    }
    if (event.target.closest(".slot, .segment, .energy-cell")) return;
    if (!event.target.closest(".floating, .tag-shelf, .dock, .topbar, .week-strip, .variant-dock, dialog")) {
      closeFloating();
    }
  }

  function onDocumentInput(event) {
    const target = event.target;
    if (target.id === "shelfSearch") {
      state.tagSearch = target.value;
      renderShelfBody();
      return;
    }
    if (target.id === "pickerSearch") {
      state.pickerSearch = target.value;
      renderPickerBody();
      return;
    }
    if (target.id === "recordNote" || target.id === "dockNote") {
      const found = state.selectedRecordId ? findRecord(state.selectedRecordId) : null;
      if (found) {
        found.record.note = target.value;
        if (state.noteRenderTimer) clearTimeout(state.noteRenderTimer);
        state.noteRenderTimer = setTimeout(() => {
          const id = state.selectedRecordId;
          renderCanvas();
          const segment = id ? document.querySelector(`.segment[data-record="${id}"]`) : null;
          if (segment) floatingTrigger = segment;
        }, 260);
      }
    }
  }

  function onDocumentChange(event) {
    if (event.target.id === "tagAddParent") {
      state.tagAddParent = event.target.value;
      const colorRow = $("#tagColorRow");
      if (colorRow) colorRow.hidden = Boolean(event.target.value);
    }
  }

  function onDocumentKeydown(event) {
    const target = event.target;
    if (event.key === "Escape" && target.id === "tagEditInput") {
      event.preventDefault();
      state.tagEditing = null;
      renderTagManager();
      return;
    }
    if (event.key === "Enter" && target.id === "tagAddName") {
      event.preventDefault();
      addTag();
      return;
    }
    if (event.key === "Enter" && target.id === "tagEditInput") {
      event.preventDefault();
      saveTagEdit(state.tagEditing?.id);
      return;
    }
    const inField = target && target.closest("input, textarea, select, [contenteditable='true']");
    if (event.key === "Escape") {
      if (document.querySelector("dialog[open]")) return;
      const openPopover = ["tagPicker", "recordPopover", "energyPopover"].find((id) => !document.getElementById(id).hidden);
      if (openPopover) {
        closeFloating();
        event.preventDefault();
        return;
      }
      if (state.selection || state.selectedRecordId) {
        clearSelection();
        renderAll();
        event.preventDefault();
      }
      return;
    }
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "z" && !inField) {
      event.preventDefault();
      undo();
      return;
    }
    if (document.querySelector("dialog[open]")) return;
    if (inField) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    if (!["tagPicker", "recordPopover", "energyPopover"].every((id) => document.getElementById(id).hidden)) return;
    const keys = ["A", "B", "C"];
    const direction = event.key === "ArrowRight" ? 1 : -1;
    event.preventDefault();
    setVariant(keys[(keys.indexOf(state.variant) + direction + 3) % 3]);
  }

  function onSlotKeyboard(event) {
    const segment = event.target.closest(".segment");
    if (segment && event.detail === 0) {
      event.preventDefault();
      selectRecord(segment.dataset.record, segment);
      if (state.variant === "C") requestAnimationFrame(() => $("#dockNote")?.focus({ preventScroll: true }));
      return;
    }
    const slot = event.target.closest(".slot");
    if (!slot || event.detail !== 0) return;
    if (state.mode === "compare") return;
    const start = Number(slot.dataset.start);
    if (event.shiftKey && state.anchorSlot !== null) {
      setSelection(Math.min(state.anchorSlot, start), Math.max(state.anchorSlot, start) + 15);
    } else {
      state.anchorSlot = start;
      setSelection(start, start + 15);
    }
    if (state.variant === "B") openTagPicker(slot);
    if (state.variant === "C") renderDock();
  }

  function bindDialog(dialog, fallback) {
    if (!dialog) return;
    let lastFocus = null;
    const originalShowModal = dialog.showModal.bind(dialog);
    dialog.showModal = () => {
      lastFocus = document.activeElement;
      originalShowModal();
    };
    dialog.addEventListener("close", () => {
      if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
      else fallback?.focus?.({ preventScroll: true });
    });
  }

  function init() {
    try {
      const raw = (new URLSearchParams(window.location.search).get("variant") || "A").toUpperCase();
      if (["A", "B", "C"].includes(raw)) state.variant = raw;
    } catch (error) {
      console.warn("无法读取变体参数", error);
    }
    state.date = new Date(TODAY);
    state.theme = "light";
    document.documentElement.dataset.theme = "light";
    document.documentElement.dataset.variant = state.variant;
    bindDialog($("#statsDialog"), $("#statsBtn"));
    bindDialog($("#tagDialog"), $('[data-action="tags"]'));
    document.addEventListener("click", onDocumentClick);
    document.addEventListener("input", onDocumentInput);
    document.addEventListener("change", onDocumentChange);
    document.addEventListener("keydown", onDocumentKeydown);
    document.addEventListener("click", onSlotKeyboard);
    document.addEventListener("pointerdown", onPointerDown);
    document.addEventListener("pointermove", onPointerMove);
    document.addEventListener("pointerup", onPointerUp);
    document.addEventListener("pointercancel", () => {
      state.pointerSelect = null;
      state.recordDrag = null;
      document.body.classList.remove("is-dragging-record");
    });
    window.addEventListener("resize", () => {
      updateFloatLift();
      const picker = $("#tagPicker");
      if (picker && !picker.hidden && window.innerWidth > 720) {
        const anchor = $(".slot.is-selected") || $(".segment.is-selected");
        if (anchor) positionFloating(picker, anchor.getBoundingClientRect());
      }
    });
    renderAll();
    requestAnimationFrame(() => {
      updateFloatLift();
      const scroller = $("#canvasScroll");
      if (scroller) scroller.scrollTop = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--row-h")) || 72) * 8;
    });
  }

  init();
})();
  </script>
</body>
</html>
