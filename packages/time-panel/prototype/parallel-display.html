<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYPE · TimeBlock 并行显示</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0d0f; color: #ececef; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif; }
    button { font: inherit; }
    .panel { width: 390px; height: 720px; overflow: hidden; display: flex; flex-direction: column; background: #151517; border: 1px solid #2b2b31; box-shadow: 0 24px 70px #0008; }
    .head { height: 42px; flex: none; display: flex; align-items: center; gap: 7px; padding: 0 10px; border-bottom: 1px solid #ffffff0c; font-size: 13px; }
    .menu { color: #888891; font-size: 17px; }
    .title { font-weight: 650; }
    .sub { color: #777780; font-size: 12px; }
    .grow { flex: 1; }
    .date { color: #b9b9c0; font-size: 12px; }
    .undo { color: #777780; }
    .body { flex: 1; min-height: 0; display: flex; }
    .timeline { flex: 1; min-width: 0; position: relative; }
    .hour { display: flex; position: relative; }
    .hour-label { width: 68px; flex: none; position: relative; color: #777780; font-size: 10px; font-variant-numeric: tabular-nums; }
    .hour-label > span { position: absolute; right: 6px; top: 5px; }
    .datemark { position: absolute; left: 7px; top: 5px; display: flex; flex-direction: column; line-height: 1.05; }
    .datemark small { color: #777780; font-size: 9px; }
    .datemark strong { font-size: 21px; margin: 2px 0; }
    .datemark em { color: #5b8def; font-size: 9px; font-style: normal; margin-top: 3px; }
    .lane { height: 48px; flex: 1; min-width: 0; position: relative; }
    .lane.secondary { height: 36px; }
    .lanes { flex: 1; min-width: 0; position: relative; }
    .grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); pointer-events: none; }
    .grid i { border-right: 1px solid #ffffff0c; border-bottom: 1px solid #ffffff12; }
    .grid i:last-child { border-right: 0; }
    .record { position: absolute; top: 4px; bottom: 4px; z-index: 2; overflow: hidden; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 7px; color: #fff; font-size: 11px; font-weight: 600; white-space: nowrap; box-shadow: inset 0 0 0 1px #ffffff12, 0 2px 5px #0002; }
    .record .time { margin-left: auto; opacity: .72; font-size: 9px; font-weight: 500; }
    .blue { background: #477bc7; }
    .purple { background: #8064b8; }
    .slate { background: #59657b; }
    .orange { background: #b97738; }
    .green { background: #317b68; }
    .secondary .record { top: 3px; bottom: 3px; border-radius: 6px; font-size: 10px; }
    .parallel-note { position: absolute; right: 5px; bottom: 2px; z-index: 3; color: #ffffff73; font-size: 8px; pointer-events: none; }
    .shelf { width: 118px; flex: none; padding: 4px 7px; border-left: 1px solid #ffffff08; }
    .shelf-head { height: 26px; color: #71717a; font-size: 10px; padding: 0 5px; }
    .tag { height: 33px; margin-bottom: 6px; border-radius: 5px; display: flex; align-items: center; padding: 0 9px; color: #fff; font-size: 12px; font-weight: 600; box-shadow: inset 0 0 0 1px #ffffff10; }
    .tag.subtag { height: 28px; margin-left: 7px; font-size: 11px; }
    .status { height: 36px; flex: none; display: flex; align-items: center; gap: 9px; padding: 0 10px 0 12px; border-top: 1px solid #ffffff14; background: #1b1b1e; color: #a2a2aa; font-size: 11px; }
    .status strong { color: #ececef; font-weight: 600; }
    .status button { border: 0; background: none; color: #a2a2aa; font-size: 11px; }
    .status .erase { color: #e0554b; }

    /* B: the hour keeps its original height; the second record is a discoverable stack. */
    .stack { position: absolute; inset: 4px 2px; z-index: 2; cursor: pointer; }
    .stack .behind { position: absolute; inset: 5px -1px -3px 5px; border-radius: 7px; background: #8064b8; box-shadow: 0 2px 6px #0004; }
    .stack .front { position: absolute; inset: 0 4px 4px 0; display: flex; align-items: center; padding: 0 8px; border-radius: 7px; color: #fff; background: #477bc7; font-size: 11px; font-weight: 600; box-shadow: inset 0 0 0 1px #ffffff16; }
    .stack .count { position: absolute; right: 7px; top: 7px; z-index: 4; min-width: 22px; height: 17px; display: grid; place-items: center; border-radius: 9px; background: #ececef; color: #242428; font-size: 9px; font-weight: 700; box-shadow: 0 1px 4px #0004; }
    .stack-popover { display: none; position: absolute; left: 54px; top: 44px; z-index: 20; width: 202px; padding: 7px; border: 1px solid #ffffff20; border-radius: 10px; background: #242428; box-shadow: 0 12px 30px #0008; }
    .hour.expanded .stack-popover { display: block; }
    .stack-popover .item { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 7px; border-radius: 6px; color: #d6d6dc; font-size: 11px; }
    .stack-popover .item:hover { background: #ffffff0b; }
    .stack-popover .dot { width: 8px; height: 8px; border-radius: 3px; }
    .stack-popover .item span:last-child { margin-left: auto; color: #8c8c95; font-size: 9px; }

    /* C: keep the time grid untouched and place parallel facts in a readable companion list. */
    .companion { height: 38px; margin: 0 4px 5px 4px; display: flex; align-items: center; gap: 7px; padding: 0 9px; border: 1px solid #8064b866; border-radius: 7px; background: #8064b81c; color: #d8cdf0; font-size: 10px; }
    .companion .dot { width: 7px; height: 18px; border-radius: 4px; background: #8064b8; }
    .companion strong { color: #ece5fa; font-size: 11px; }
    .companion .time { margin-left: auto; color: #9d8abb; font-size: 9px; }
    .switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 7px 10px; border: 1px solid #ffffff24; border-radius: 22px; background: #2c2c31; box-shadow: 0 8px 26px #0009; color: #ececef; font-size: 12px; }
    .switcher button { width: 26px; height: 26px; border: 0; border-radius: 50%; background: #ffffff0b; color: #ececef; cursor: pointer; }
    .switcher .label { min-width: 118px; text-align: center; }
    .prototype { position: fixed; top: 16px; left: 18px; color: #666670; font-size: 10px; letter-spacing: .08em; }
  </style>
</head>
<body>
  <!-- Three parallel-display variants at the real 390px sidebar width; switch with ?variant=A/B/C. -->
  <div class="prototype">THROWAWAY PROTOTYPE · 390 PX</div>
  <main class="panel" aria-label="TimeBlock 并行显示视觉原型">
    <header class="head"><span class="menu">☰</span><span class="title">小秘书-时间块</span><span class="sub">实录</span><span class="grow"></span><span class="date">11月6日 周五</span><span class="undo">↶</span></header>
    <div class="body">
      <section class="timeline" id="timeline"></section>
      <aside class="shelf">
        <div class="shelf-head">‹‹&nbsp; 合上所有内容</div>
        <div class="tag blue">工作</div><div class="tag subtag green">学习</div>
        <div class="tag blue">通勤</div><div class="tag purple">听视频</div>
        <div class="tag orange">吃饭</div><div class="tag slate">睡眠</div>
      </aside>
    </div>
    <footer class="status"><span id="status-text"></span><span class="grow"></span><button>不选</button><button class="erase">橡皮</button></footer>
  </main>
  <nav class="switcher" aria-label="原型方案切换"><button id="prev" aria-label="上一方案">←</button><span class="label" id="variant-label"></span><button id="next" aria-label="下一方案">→</button></nav>
  <script>
    const variants = { A: '错层卡片', B: '层叠摘要', C: '行下清单' }
    const keys = Object.keys(variants)
    const query = new URLSearchParams(location.search)
    let current = keys.includes(query.get('variant')) ? query.get('variant') : 'A'
    const grid = '<div class="grid">' + '<i></i>'.repeat(6) + '</div>'
    const label = (hour, first = false) => `<div class="hour-label">${first ? '<div class="datemark"><small>11月</small><strong>6</strong><small>周五</small><em>今天</em></div>' : ''}<span>${hour}</span></div>`
    const record = (text, color, start, span, time = '') => `<div class="record ${color}" style="left:calc(${start / 6 * 100}% + 2px);width:calc(${span / 6 * 100}% - 4px)"><span>${text}</span>${time ? `<span class="time">${time}</span>` : ''}</div>`
    const normal = (hour, content = '', first = false) => `<div class="hour">${label(hour, first)}<div class="lane">${grid}${content}</div></div>`
    function renderA() {
      return normal('8', record('睡眠', 'slate', 0, 6), true) +
        `<div class="hour">${label('9')}<div class="lanes">
          <div class="lane">${grid}${record('通勤', 'blue', 0, 4)}</div>
          <div class="lane secondary">${grid}${record('听 Git 热榜', 'purple', 1, 5, '40 分')}</div>
        </div></div>` +
        normal('10', record('工作 · 产品评审', 'blue', 0, 6)) + normal('11', record('吃饭', 'orange', 0, 3))
    }
    function renderB() {
      return normal('8', record('睡眠', 'slate', 0, 6), true) +
        `<div class="hour" id="stack-hour">${label('9')}<div class="lane">${grid}
          <div class="stack" id="stack" role="button" tabindex="0" aria-label="展开两条并行记录" style="left:2px;width:calc(${4 / 6 * 100}% - 4px)">
            <div class="behind"></div><div class="front">通勤</div><div class="count">+1</div>
          </div>
          <div class="stack-popover"><div class="item"><i class="dot blue"></i>通勤<span>09:00–09:40</span></div><div class="item"><i class="dot purple"></i>听 Git 热榜<span>09:10–09:50</span></div></div>
        </div></div>` +
        normal('10', record('工作 · 产品评审', 'blue', 0, 6)) + normal('11', record('吃饭', 'orange', 0, 3))
    }
    function renderC() {
      return normal('8', record('睡眠', 'slate', 0, 6), true) +
        `<div class="hour">${label('9')}<div class="lanes"><div class="lane">${grid}${record('通勤', 'blue', 0, 4)}</div>
          <div class="companion"><i class="dot"></i><strong>听 Git 热榜</strong><span>同时</span><span class="time">09:10–09:50</span></div>
        </div></div>` +
        normal('10', record('工作 · 产品评审', 'blue', 0, 6)) + normal('11', record('吃饭', 'orange', 0, 3))
    }
    function render() {
      document.getElementById('timeline').innerHTML = ({ A: renderA, B: renderB, C: renderC })[current]()
      document.getElementById('variant-label').textContent = `${current} · ${variants[current]}`
      document.getElementById('status-text').innerHTML = current === 'A' ? '<strong>2 条并行</strong> · 原格不变，向下错层' : current === 'B' ? '<strong>2 条并行</strong> · 点击 +1 查看' : '<strong>2 条并行</strong> · 时长由文字表达'
      if (current === 'B') {
        const hour = document.getElementById('stack-hour')
        document.getElementById('stack').onclick = () => hour.classList.toggle('expanded')
      }
      const url = new URL(location.href); url.searchParams.set('variant', current); history.replaceState(null, '', url)
    }
    function move(amount) { current = keys[(keys.indexOf(current) + amount + keys.length) % keys.length]; render() }
    document.getElementById('prev').onclick = () => move(-1)
    document.getElementById('next').onclick = () => move(1)
    window.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') move(-1); if (event.key === 'ArrowRight') move(1) })
    render()
  </script>
</body>
</html>
