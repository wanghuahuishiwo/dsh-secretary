# One installable bundle: global SQLite-backed services and a Secretary preset.
# 办公文档技能（桌面端宿主默认全局注册）对本机不需要，整层禁用；
# 影响所有 preset（含 standard），回滚 = 删除下面两行。
- id: skill-office
  disabled: true
# 宿主 Goal Service 与本项目的空 Provider 共用 goals key；保留后者及其工具语义。
- id: goal
  disabled: true
- insert:
    - id: storage-sqlite
      name: '@deepseek-ai/dsh-storage-sqlite'
      config:
        path: !!js dshHomePath('storages', 'secretary.db')
        journalMode: wal

    - id: secretary-storage
      name: 'dsh-secretary-storage-domain'

    # 上游共享 Goal Provider；当前为空，只建立 service seam。
    # 本列表行序仅用于阅读，启动与重载由 Cordis inject 驱动。
    - id: secretary-goal
      name: 'dsh-secretary-goal-provider'

    # GTD 数据面是 Markdown（secretary-agent 的 gtdPath），SQLite GTD 域已退役。

    - id: secretary-tag
      name: 'dsh-secretary-tag-service'

    - id: secretary-time-block
      name: 'dsh-secretary-time-block'

    # 独立 Time 产品：Host Remote controller 与浏览器 UI 各自一个包。
    # time/tag 的 agent 能力面经 CLI（secretaryTime/secretaryTag agentInvoke
    # Remote + shell-env 注入），会话内工具已退役。
    - id: secretary-time-controller
      name: 'dsh-secretary-time-controller'

    # 浏览器 roster 行：空 Host apply，只承载 dsh.client 的右栏 UI。
    - id: secretary-ui-time
      name: 'dsh-secretary-ui-time'

    # 独立事项产品：左栏入口与空白 main；没有 GTD Remote/API。
    - id: secretary-ui-gtd
      name: 'dsh-secretary-ui-gtd'

    - id: preset-secretary
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: secretary
        name: Secretary
        description: A trusted personal secretary who anticipates needs, prepares work, negotiates plans, and follows through.
        order: 10
        # 插件底座与官方 standard preset 全量对齐（web-app/presets/standard.patch.yml），
        # 差异仅：persona 文案、skill-filesystem 显式禁用、无 plan-mode、
        # 末尾追加本项目领域件。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是用户的私人秘书：一个连贯的人，长期负责用户的承诺、时间与准备。
                先理解再行动；准备自主做，写入事实先确认，永不伪造。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          # 显式禁用全局技能目录：技能只来自当前插件的运行时注册，
          # 消除 71 个全局技能噪音与旧 vault 同名冲突；skill 工具与 runtime 注册不受影响。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            disabled: true
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
          # secretary_time / secretary_tag / secretary_gtd 会话内工具已退役：
          # time/tag 经 CLI，GTD 经 Markdown 数据面（见 secretary skill）。
          - id: secretary-gtd-agent
            name: 'dsh-secretary-gtd-agent'
          - id: secretary-agent
            name: 'dsh-secretary'
            config:
              defaultTimeZone: Asia/Shanghai
              timePlanPath: /Users/wanghuahui/my_knowledge/life-plan/01-人生规划.md
              gtdPath: !!js dshHomePath('storages', 'secretary', 'gtd')
